<!-- PAGE SETTINGS → Before </body> tag (limit 10 000 znaků).
     Orchestrace animací. Logika dema a grafu žije v jejich embedech.
     Očekávané selektory (viz BUILD_PLAN.md):
       .h1_line          – řádky hero H1 (2 spany)
       .hero_sub         – hero perex, .hero_cta-group – skupina CTA
       .hero_demo-wrap   – wrapper dema (perspective), [data-au-demo] – laptop/telefon
       [data-reveal]     – prvky pro scroll reveal (číslo = pořadí staggeru)
       [data-tbar] / [data-tnode] – timeline čára a uzly (sekce Jak to probíhá)
       [data-price]      – „8 000 Kč", [data-count40] – číslo 40 v „Rozbor 40+ bodů"
       [data-sticky-cta] – mobilní sticky lišta, #objednavka – sekce formuláře
-->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script>
(function () {
  if (!window.gsap || !window.ScrollTrigger) return;
  gsap.registerPlugin(ScrollTrigger);
  var mm = gsap.matchMedia();

  /* Sticky mobilní CTA — funguje i při reduced motion (jen display, bez animace) */
  var bar = document.querySelector('[data-sticky-cta]');
  var form = document.getElementById('objednavka');
  var formIn = false, past = false;
  function barSync() {
    if (!bar) return;
    var show = past && !formIn && window.innerWidth <= 767;
    bar.style.transform = show ? 'translateY(0)' : 'translateY(110%)';
  }
  if (bar) {
    bar.style.transition = 'transform 250ms ease';
    bar.style.transform = 'translateY(110%)';
    window.addEventListener('scroll', function () {
      var p = (window.scrollY || 0) > 500;
      if (p !== past) { past = p; barSync(); }
    }, { passive: true });
    window.addEventListener('resize', barSync);
    if (form && 'IntersectionObserver' in window) {
      new IntersectionObserver(function (es) {
        es.forEach(function (en) { formIn = en.isIntersecting; barSync(); });
      }, { threshold: 0.05 }).observe(form);
    }
  }

  mm.add('(prefers-reduced-motion: no-preference)', function () {
    /* Hero on load: H1 po řádcích, pak sub a CTA */
    var lines = gsap.utils.toArray('.h1_line');
    var intro = gsap.timeline({ defaults: { ease: 'power3.out' } });
    if (lines.length) {
      intro.from(lines, { y: 30, opacity: 0, duration: 0.7, stagger: 0.08 });
    } else {
      intro.from('.section_hero h1', { y: 30, opacity: 0, duration: 0.7 });
    }
    intro.from('.hero_sub', { y: 20, opacity: 0, duration: 0.5 }, '-=0.35')
         .from('.hero_cta-group', { y: 20, opacity: 0, duration: 0.5 }, '-=0.3');

    /* Laptop/telefon dema: rotateX 14° → 0° + scale, scrub */
    var demoWrap = document.querySelector('.hero_demo-wrap');
    if (demoWrap) {
      gsap.fromTo('[data-au-demo]',
        { rotateX: 14, scale: 0.96, transformOrigin: 'top center' },
        { rotateX: 0, scale: 1.04, ease: 'none',
          scrollTrigger: { trigger: demoWrap, start: 'top 92%', end: 'top 20%', scrub: true } });
    }

    /* Scroll reveal — jen jednou, opacity 0→1, y 24→0, stagger dle data-reveal */
    gsap.utils.toArray('[data-reveal]').forEach(function (el) {
      var d = (parseInt(el.getAttribute('data-reveal'), 10) || 0) * 0.08;
      gsap.fromTo(el, { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.6, delay: d, ease: 'power2.out',
          scrollTrigger: { trigger: el, start: 'top 88%', once: true } });
    });

    /* Timeline: čára scaleX scrub, uzly popnou postupně */
    var tbar = document.querySelector('[data-tbar]');
    if (tbar) {
      gsap.fromTo(tbar, { scaleX: 0, transformOrigin: 'left center' },
        { scaleX: 1, ease: 'none',
          scrollTrigger: { trigger: tbar, start: 'top 85%', end: 'top 45%', scrub: true } });
      gsap.utils.toArray('[data-tnode]').forEach(function (n, i) {
        gsap.fromTo(n, { opacity: 0, scale: 0.3 },
          { opacity: 1, scale: 1, duration: 0.25, delay: 0.22 + i * 0.19, ease: 'back.out(2)',
            scrollTrigger: { trigger: tbar, start: 'top 80%', once: true } });
      });
    }

    /* Cena: jemný scale-in ceny */
    var price = document.querySelector('[data-price]');
    if (price) {
      gsap.fromTo(price, { scale: 0.92, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.6, ease: 'power3.out',
          scrollTrigger: { trigger: price, start: 'top 85%', once: true } });
    }

    /* „40+" čítač 0→40 */
    var c40 = document.querySelector('[data-count40]');
    if (c40) {
      var o = { v: 0 };
      gsap.to(o, { v: 40, duration: 0.8, ease: 'power3.out',
        onUpdate: function () { c40.textContent = String(Math.round(o.v)); },
        scrollTrigger: { trigger: c40, start: 'top 85%', once: true } });
    }
    return function () {};
  });

  /* Reduced motion: vše viditelné bez animací */
  mm.add('(prefers-reduced-motion: reduce)', function () {
    gsap.set('[data-reveal], .h1_line, .hero_sub, .hero_cta-group, [data-tnode], [data-price]', { clearProps: 'all', opacity: 1 });
    var c40 = document.querySelector('[data-count40]');
    if (c40) c40.textContent = '40';
    return function () {};
  });
})();
</script>
