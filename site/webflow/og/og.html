<!doctype html>
<html lang="cs"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Bricolage";src:url(bricolage-grotesque-var.woff2) format("woff2");font-weight:200 800;font-stretch:75% 100%}
@font-face{font-family:"Instrument";src:url(instrument-sans-var.woff2) format("woff2");font-weight:400 700}
:root{--ink:#101321;--t2:#3A3F52;--mute:#646A7E;--line:#CDD2DC;--line2:#AEB5C4;--blue:#1D2BE8}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;background:#fff;overflow:hidden}
body{color:var(--ink);font-family:"Instrument",sans-serif;-webkit-font-smoothing:antialiased}
/* rastr: okraje 72/64, levá zóna 1fr, pravá 248 px, mezera 56 */
.page{position:absolute;inset:64px 72px;display:grid;grid-template-columns:1fr 248px;grid-template-rows:auto 1fr;column-gap:56px;row-gap:40px}
.logo{display:flex;align-items:center;gap:16px;font-weight:600;font-size:38px;letter-spacing:-.012em;color:var(--blue)}
.logo img{width:46px;height:46px;display:block}
.main{grid-column:1;display:flex;flex-direction:column;justify-content:flex-end}
h1{font-family:"Bricolage";font-weight:560;font-variation-settings:"opsz" 96;font-size:118px;line-height:.91;letter-spacing:-.042em;color:var(--ink);margin-top:-12px}
h1 .b{color:var(--blue)}
.proof{grid-column:2;display:flex;flex-direction:column;justify-content:space-between}
.stat{border-top:2px solid var(--ink);padding-top:16px}
.num{font-family:"Bricolage";font-weight:380;font-variation-settings:"opsz" 96;font-size:124px;line-height:.82;letter-spacing:-.045em;color:var(--ink)}
.lab{margin-top:12px;font-weight:500;font-size:25px;line-height:1.15;color:var(--t2)}
</style></head>
<body><div class="page">
  <div class="logo" style="grid-column:1/-1"><img src="symbol-blue.png" alt="">Webkit.Studio</div>
  <div class="main">
    <h1><span class="b">Ptáme se.</span><br>Navrhujeme.<br>Stavíme.</h1>
  </div>
  <div class="proof">
    <div class="stat"><div class="num">30+</div><div class="lab">úspěšných<br>projektů</div></div>
    <div class="stat"><div class="num">5+</div><div class="lab">let<br>zkušeností</div></div>
  </div>
</div></body></html>
