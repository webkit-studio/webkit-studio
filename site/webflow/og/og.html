<!doctype html>
<html lang="cs"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Bricolage";src:url(bricolage-grotesque-var.woff2) format("woff2");font-weight:200 800;font-stretch:75% 100%}
@font-face{font-family:"Instrument";src:url(instrument-sans-var.woff2) format("woff2");font-weight:400 700}
@font-face{font-family:"Plex Mono";src:url(ibm-plex-mono-500.woff2) format("woff2");font-weight:500}
:root{--ink:#101321;--t2:#3A3F52;--mute:#646A7E;--line:#CDD2DC;--line2:#AEB5C4;--blue:#1D2BE8}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;background:#fff;overflow:hidden}
body{color:var(--ink);font-family:"Instrument",sans-serif;-webkit-font-smoothing:antialiased}
/* rastr: okraje 72/64, levá zóna 1fr, pravá 248 px, mezera 56 */
.page{position:absolute;inset:64px 72px;display:grid;grid-template-columns:1fr 248px;grid-template-rows:34px 1fr;column-gap:56px;row-gap:50px}
.logo{display:flex;align-items:center;gap:13px;font-weight:600;font-size:28px;letter-spacing:-.012em;color:var(--blue)}
.logo img{width:34px;height:34px;display:block}
.url{display:flex;align-items:center;font-family:"Plex Mono";font-weight:500;font-size:17px;letter-spacing:.01em;color:var(--mute)}
.main{display:flex;flex-direction:column;justify-content:space-between}
h1{font-family:"Bricolage";font-weight:560;font-variation-settings:"opsz" 96;font-size:118px;line-height:.91;letter-spacing:-.042em;color:var(--ink);margin-top:-12px}
h1 .b{color:var(--blue)}
.tags{display:flex;gap:8px;list-style:none;white-space:nowrap}
.tags li{font-weight:500;font-size:20px;line-height:1;color:var(--t2);border:1.5px solid var(--line2);border-radius:999px;padding:10px 15px 11px}
.proof{display:flex;flex-direction:column;justify-content:space-between}
.stat{border-top:2px solid var(--ink);padding-top:16px}
.num{font-family:"Bricolage";font-weight:380;font-variation-settings:"opsz" 96;font-size:124px;line-height:.82;letter-spacing:-.045em;color:var(--ink)}
.lab{margin-top:12px;font-weight:500;font-size:21px;line-height:1.2;color:var(--t2)}
</style></head>
<body><div class="page">
  <div class="logo"><img src="symbol-blue.png" alt="">Webkit.Studio</div>
  <div class="url">webkit.studio</div>
  <div class="main">
    <h1><span class="b">Ptáme se.</span><br>Navrhujeme.<br>Stavíme.</h1>
    <ul class="tags"><li>Weby</li><li>Vizuální identity</li><li>Aplikace</li><li>Redesign</li><li>Marketing</li></ul>
  </div>
  <div class="proof">
    <div class="stat"><div class="num">5+</div><div class="lab">let zkušeností</div></div>
    <div class="stat"><div class="num">30+</div><div class="lab">úspěšných projektů</div></div>
  </div>
</div></body></html>
