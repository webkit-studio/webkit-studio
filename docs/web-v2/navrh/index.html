<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Webkit.Studio v2 náhled</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400..700&display=swap">
<style>
/* Náhled D03 (šťáva). Rytmus barevných bloků: bílá → světle modrý tón → bílá → tmavý ink → bílá → sytě modrá → tón → modrá CTA → ink patička.
   Lišta nahoře je mimo design webu. Rám je CSS container, takže 1440 / 390 přepíná skutečné breakpointy.
   Web v2 je jen světlý (bílá a modrá); barevné bloky jsou součást designu, tmavý režim není v rozsahu. */
:root{
  color-scheme: light;
  --c-white:#FFFFFF;
  --c-surface:#F5F6F9;
  --c-surface-2:#ECEEF4;
  --c-line:#E0E3EB;
  --c-line-strong:#C5CAD6;
  --c-ink:#0C0E1C;
  --c-ink-soft:#161A30;
  --c-ink-2:#464B5E;
  --c-ink-3:#5E6376;
  --c-blue:#1D2BE8;
  --c-blue-hover:#1520C4;
  --c-blue-press:#0F189A;
  --c-blue-deep:#0B1170;
  --c-tint:#EEF2FF;
  --c-tint-line:#D3DCFA;
  --c-blue-100:#DCE4FF;
  --c-blue-on-dark:#8FA8FF;
  --c-on-blue-2:rgba(255,255,255,.82);
  --c-on-ink-2:rgba(255,255,255,.72);
  --c-line-on-dark:rgba(255,255,255,.16);
  --c-error:#C0261B;
  --c-warn-bg:#FFF4D6;
  --c-warn-ink:#6B4A00;
  --f-display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r-sm:10px; --r-md:16px; --r-lg:24px; --r-pill:999px;
  --dur-1:150ms; --dur-2:300ms; --dur-3:500ms; --dur-4:800ms;
  --ease-out:cubic-bezier(.2,.7,.2,1);
  --ease-draw:cubic-bezier(.14,0,0,1.01);
  --tb-h:0px;
  --pv-bg:#E6E8EE;
}
*{box-sizing:border-box}
body{margin:0;background:var(--pv-bg);color:var(--c-ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}

/* ============ NÁHLED: lišta ============ */
.pv{position:sticky;top:env(safe-area-inset-top,0px);z-index:200;background:#fff;border-bottom:1px solid var(--c-line);color:var(--c-ink)}
.pv__row{display:flex;align-items:center;gap:12px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));flex-wrap:wrap}
.pv__brand{display:flex;align-items:center;gap:8px;font:600 14px/1 var(--f-body);white-space:nowrap}
.pv__brand small{font:500 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--c-ink-3)}
.pv__tabs{display:flex;gap:2px;background:var(--c-surface-2);padding:3px;border-radius:var(--r-pill);overflow-x:auto;max-width:100%;scrollbar-width:none}
.pv__tab{border:0;background:transparent;padding:0 14px;min-height:32px;border-radius:var(--r-pill);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--c-ink-2)}
.pv__tab:hover{color:var(--c-ink)}
.pv__tab[aria-selected="true"]{background:#fff;color:var(--c-ink);box-shadow:0 0 0 1px var(--c-line)}
.pv__tab--lib[aria-selected="true"]{background:var(--c-ink);color:#fff;box-shadow:none}
.pv__sep{flex:1}
.pv__seg{display:flex;gap:2px;background:var(--c-surface-2);padding:3px;border-radius:var(--r-pill)}
.pv__seg button{border:0;background:transparent;min-height:28px;padding:0 10px;border-radius:var(--r-pill);font:500 12px/1 var(--f-mono);cursor:pointer;color:var(--c-ink-2)}
.pv__seg button[aria-pressed="true"]{background:#fff;color:var(--c-ink);box-shadow:0 0 0 1px var(--c-line)}
.pv__chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--c-ink-2);cursor:pointer;min-height:28px;white-space:nowrap}
.pv__chk input{width:16px;height:16px;accent-color:var(--c-blue);margin:0}
.pv__order{display:flex;align-items:center;gap:8px;padding:0 16px 8px;font-size:12px;color:var(--c-ink-3);overflow-x:auto;white-space:nowrap}
.pv__order b{font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--c-ink-2)}
.pv__order ol{display:flex;gap:6px;margin:0;padding:0;list-style:none}
.pv__order li{display:flex;align-items:center;gap:5px}
.pv__order li+li::before{content:"→";color:var(--c-line-strong);margin-right:1px}
.pv__order i{width:10px;height:10px;border-radius:3px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(12,14,28,.18)}
.pv__order .is-hidden{text-decoration:line-through;opacity:.6}
.pv button:focus-visible,.pv input:focus-visible{outline:2px solid var(--c-blue);outline-offset:2px}
@media (max-width:720px){.pv__order{display:none}.pv__brand small{display:none}}
.stage{padding:16px 16px 48px;display:flex;justify-content:center}
.stage--fit{padding:0}
.frame{--zoom:1;width:100%;background:#fff;container:site / inline-size;position:relative;zoom:var(--zoom);isolation:isolate}
.stage--w1440 .frame{width:1440px;flex:none;box-shadow:0 0 0 1px var(--c-line)}
.stage--w390 .frame{width:390px;flex:none;box-shadow:0 0 0 1px var(--c-line-strong);border-radius:28px;overflow:clip}

/* ============ WEB v2 ============ */
.site{font-family:var(--f-body);color:var(--c-ink);font-size:1rem;line-height:1.6;
  --gutter:clamp(16px,4.2cqi,56px);
  --sec-y:clamp(4.5rem,2.6rem + 7cqi,9.5rem);
  --t-h1:clamp(2.5rem,1rem + 4.6cqi,5.25rem);
  --t-h1-home:clamp(2.75rem,.8rem + 6cqi,6.5rem);
  --t-h2:clamp(2rem,1rem + 3cqi,3.75rem);
  --t-h3:clamp(1.25rem,1.05rem + .7cqi,1.75rem);
  --t-statement:clamp(2rem,.9rem + 3.6cqi,4.5rem);
  --t-medium:clamp(1.5rem,1rem + 1.7cqi,2.625rem);
  --t-lead:clamp(1.125rem,1rem + .45cqi,1.375rem);
  --vh:calc(100vh / var(--zoom,1) - var(--tb-h));
}
.site *:focus-visible{outline:2px solid var(--c-blue);outline-offset:3px;border-radius:4px}
.site :where(h1,h2,h3,h4){font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;color:inherit}
.site :where(h1){font-size:var(--t-h1);line-height:1.02;letter-spacing:-.04em}
.site :where(h2){font-size:var(--t-h2);line-height:1.05;letter-spacing:-.035em}
.site :where(h3){font-size:var(--t-h3);line-height:1.2;letter-spacing:-.02em}
.site :where(p){margin:0;text-wrap:pretty}
.site :where(a){color:inherit}
.site :where(ul,ol){margin:0;padding:0;list-style:none}
.container{max-width:1312px;margin-inline:auto;padding-inline:var(--gutter)}
.sec{padding-block:var(--sec-y);position:relative}
.lead{font-size:var(--t-lead);line-height:1.5;color:var(--c-ink-2);max-width:46ch}
.muted{color:var(--c-ink-2)}
.hl{color:var(--c-blue)}
.fill{background:var(--c-warn-bg);color:var(--c-warn-ink);font:500 .78em/1.2 var(--f-mono);padding:.1em .35em;border-radius:4px;letter-spacing:0;border:1px dashed #D9B350;box-decoration-break:clone;-webkit-box-decoration-break:clone}
h1 .fill,h2 .fill,h3 .fill,blockquote .fill,.statement .fill,.work__h .fill,.bigrow .fill{font-size:.38em;vertical-align:middle;line-height:1.6}
/* Návrh, který potvrdí Lukáš (délky kroků, nástroje) */
.nv{text-decoration:underline dotted 2px;text-decoration-color:#D9A400;text-underline-offset:.2em;cursor:help}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Barevné bloky (rytmus) ---------- */
.b-white{background:var(--c-white);color:var(--c-ink)}
.b-tint{background:var(--c-tint);color:var(--c-ink)}
.b-ink{background:var(--c-ink);color:#fff}
.b-blue{background:var(--c-blue);color:#fff}
.b-ink .lead,.b-ink .muted{color:var(--c-on-ink-2)}
.b-blue .lead,.b-blue .muted{color:var(--c-on-blue-2)}
.b-ink .hl{color:var(--c-blue-on-dark)}
.b-blue .hl{color:#fff;text-decoration:underline;text-decoration-thickness:.06em;text-underline-offset:.12em}
.b-ink *:focus-visible,.b-blue *:focus-visible{outline-color:#fff}

/* Tlačítko */
.btn{--bg:var(--c-blue);--fg:#fff;--disc:#fff;--disc-fg:var(--c-blue);--bd:transparent;
  display:inline-flex;align-items:center;gap:12px;min-height:52px;padding:6px 6px 6px 24px;border-radius:var(--r-pill);
  background:var(--bg);color:var(--fg);border:1px solid var(--bd);text-decoration:none;font:600 1rem/1 var(--f-body);
  cursor:pointer;transition:background-color var(--dur-2) var(--ease-out),border-color var(--dur-2),color var(--dur-2),transform var(--dur-1);white-space:nowrap}
.btn__label{display:block;overflow:hidden;height:1.25em;line-height:1.25em}
.btn__label>span{display:block;position:relative;transition:transform var(--dur-2) var(--ease-out)}
.btn__label>span::after{content:attr(data-t);content:attr(data-t) / "";position:absolute;left:0;top:100%;white-space:nowrap}
.btn__disc{width:40px;height:40px;border-radius:50%;background:var(--disc);color:var(--disc-fg);display:grid;place-items:center;overflow:hidden;flex:none}
.btn__disc svg{width:16px;height:16px;transition:transform var(--dur-2) var(--ease-out);grid-area:1/1}
.btn__disc svg+svg{transform:translateX(-160%)}
.btn:hover .btn__label>span,.btn.is-hover .btn__label>span{transform:translateY(-100%)}
.btn:hover .btn__disc svg:first-child,.btn.is-hover .btn__disc svg:first-child{transform:translateX(160%)}
.btn:hover .btn__disc svg+svg,.btn.is-hover .btn__disc svg+svg{transform:none}
.btn:hover,.btn.is-hover{--bg:var(--c-blue-hover)}
.btn:active{transform:scale(.98);--bg:var(--c-blue-press)}
.btn--secondary{--bg:transparent;--fg:var(--c-ink);--bd:var(--c-line-strong);--disc:var(--c-ink);--disc-fg:#fff}
.btn--secondary:hover,.btn--secondary.is-hover{--bg:var(--c-ink);--fg:#fff;--bd:var(--c-ink);--disc:#fff;--disc-fg:var(--c-ink)}
.btn--white{--bg:#fff;--fg:var(--c-ink);--disc:var(--c-blue);--disc-fg:#fff}
.btn--white:hover,.btn--white.is-hover{--bg:var(--c-tint)}
.btn--sm{min-height:44px;padding:4px 4px 4px 18px;font-size:.9375rem;gap:10px}
.btn--sm .btn__disc{width:34px;height:34px}
.btn.is-loading .btn__disc svg{display:none}
.btn.is-loading .btn__disc::after{content:"";width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-row{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}

/* Odkaz */
.link{color:inherit;text-decoration:none;font-weight:500;background:linear-gradient(currentColor,currentColor) no-repeat right bottom/0 1px;padding-bottom:2px;transition:background-size var(--dur-3) var(--ease-draw)}
.link:hover,.link.is-hover{background-size:100% 1px;background-position-x:left}
.link--static{background-size:100% 1px}
.link--static:hover{background-size:0 1px;background-position-x:right}
.link--arrow{display:inline-flex;align-items:center;gap:8px;min-height:44px}
.link--arrow svg{width:14px;height:14px;transition:transform var(--dur-2) var(--ease-out)}
.link--arrow:hover svg{transform:translate(2px,-2px)}

/* Hlavička sekce: nadpis + volitelný perex, bez štítku */
.sh{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px clamp(2rem,5cqi,6rem);align-items:end;margin-bottom:clamp(2.5rem,1.5rem + 3.5cqi,5rem)}
.sh--solo{grid-template-columns:minmax(0,1fr);max-width:960px}
.sh__side{display:grid;gap:20px;justify-items:start}
@container site (max-width:860px){.sh{grid-template-columns:1fr}}

/* ---------- Navbar ---------- */
.nav{position:sticky;top:var(--tb-h);z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:transform var(--dur-3) var(--ease-out),border-color var(--dur-2)}
.nav.is-scrolled{border-bottom-color:var(--c-line)}
.nav.is-hidden{transform:translateY(-100%)}
.nav.is-open{transform:none}
.nav__in{display:flex;align-items:center;gap:32px;height:76px}
.logo{display:inline-flex;align-items:center;gap:.42em;text-decoration:none;color:var(--c-ink);font:600 1.3rem/1 var(--f-body);letter-spacing:-.035em;min-height:44px;white-space:nowrap}
.logo svg{width:1.15em;height:1.15em;flex:none;color:var(--c-blue)}
.nav__links{display:flex;align-items:center;gap:4px;margin-left:auto}
.nav__link{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:var(--r-pill);border:0;background:none;text-decoration:none;font:500 .9375rem/1 var(--f-body);color:var(--c-ink);cursor:pointer}
.nav__link:hover,.nav__link[aria-expanded="true"]{background:var(--c-surface)}
.nav__link svg{width:14px;height:14px;transition:transform var(--dur-2)}
.nav__link[aria-expanded="true"] svg{transform:rotate(180deg)}
.nav__burger{display:none;margin-left:auto;width:48px;height:48px;border-radius:50%;border:1px solid var(--c-line-strong);background:#fff;cursor:pointer;place-items:center}
.nav__burger span{display:block;width:18px;height:1.5px;background:var(--c-ink);position:relative}
.nav__burger span::before,.nav__burger span::after{content:"";position:absolute;left:0;width:18px;height:1.5px;background:var(--c-ink);transition:transform var(--dur-2)}
.nav__burger span::before{top:-6px}.nav__burger span::after{top:6px}
.nav.is-open .nav__burger span{background:transparent}
.nav.is-open .nav__burger span::before{transform:translateY(6px) rotate(45deg)}
.nav.is-open .nav__burger span::after{transform:translateY(-6px) rotate(-45deg)}
.menu{position:absolute;left:0;right:0;top:100%;background:#fff;border-bottom:1px solid var(--c-line);opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity var(--dur-2),transform var(--dur-2) var(--ease-out),visibility 0s linear var(--dur-2)}
.menu.is-open{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.menu__in{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) minmax(0,.8fr);gap:8px 48px;padding-block:32px 40px}
.menu a{display:flex;align-items:center;min-height:52px;border-bottom:1px solid var(--c-line);text-decoration:none;font:600 1.125rem/1.2 var(--f-display);letter-spacing:-.01em}
.menu a:hover,.menu a[aria-current="page"]{color:var(--c-blue)}
.menu__side{display:grid;align-content:start;gap:14px;padding-left:32px;border-left:1px solid var(--c-line)}
.menu__side p{color:var(--c-ink-2);font-size:.9375rem}
.menu__side a{border:0;min-height:auto;font:500 1rem/1.3 var(--f-body)}
.menu__extra{display:none}
@container site (max-width:991px){
  .nav__links,.nav__cta{display:none}
  .nav__burger{display:grid}
  .nav__in{height:68px}
  .menu{max-height:calc(100vh - 68px - var(--tb-h));overflow:auto}
  .menu__in{grid-template-columns:1fr;gap:0;padding-block:12px 28px}
  .menu__side{padding:20px 0 0;border:0}
  .menu__extra{display:block}
}

/* ---------- Hero ---------- */
.hero{padding-block:clamp(2.5rem,1.5rem + 4cqi,6rem) clamp(2.5rem,1.5rem + 3cqi,4.5rem);overflow:hidden}
.hero__grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:clamp(2rem,4cqi,4rem);align-items:center}
.hero__text{display:grid;gap:30px;justify-items:start;min-width:0;position:relative;z-index:1}
.hero--home h1{font-size:var(--t-h1-home);line-height:.98;letter-spacing:-.05em;max-width:12.5ch}
.hero__cta{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px}
.hero__promise{font-size:.9375rem;color:var(--c-ink-2);display:flex;align-items:center;gap:8px}
.hero__promise::before{content:"";width:8px;height:8px;border-radius:50%;background:#1E9E5A;box-shadow:0 0 0 4px rgba(30,158,90,.16)}
.facts{display:flex;flex-wrap:wrap;gap:12px clamp(1.5rem,4cqi,3.5rem);padding-top:26px;border-top:1px solid var(--c-line);width:100%}
.fact{display:grid;gap:4px}
.fact b{font:600 clamp(2.5rem,1.6rem + 2.4cqi,4rem)/.9 var(--f-display);letter-spacing:-.05em;color:var(--c-ink)}
.fact b span{color:var(--c-blue)}
.fact small{font-size:.9375rem;color:var(--c-ink-2);line-height:1.35}
.hero__art{position:relative;align-self:stretch;min-height:560px;margin-right:calc(-1 * var(--gutter) - max(0px,(100cqi - 1312px)/2));margin-block:calc(-1 * clamp(2.5rem,1.5rem + 4cqi,6rem)) 0}
.tilefield{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
.field-hint{position:absolute;left:18px;bottom:16px;font:500 .75rem/1 var(--f-mono);color:var(--c-ink-3);background:rgba(255,255,255,.86);padding:7px 10px;border-radius:var(--r-pill);pointer-events:none}
.partner-badge{display:inline-flex;align-items:center;gap:12px;padding:8px 16px 8px 8px;border-radius:var(--r-pill);background:var(--c-tint);text-decoration:none;color:var(--c-ink);font-weight:600;font-size:.9375rem;min-height:44px}
.partner-badge img{width:28px;height:28px;padding:6px;background:#fff;border-radius:50%}
.partner-badge small{font-weight:400;color:var(--c-ink-2)}
.logos{display:flex;flex-wrap:wrap;align-items:center;gap:22px clamp(2rem,5cqi,4.5rem);margin-top:clamp(2.5rem,1.5rem + 3cqi,4.5rem);padding-top:28px;border-top:1px solid var(--c-line)}
.logos li{display:flex}
.logos img{height:var(--h,30px);width:auto;opacity:.62;transition:opacity var(--dur-2),transform var(--dur-2) var(--ease-out)}
.logos li:hover img{opacity:1;transform:translateY(-2px)}
@container site (max-width:860px){
  .hero__grid{grid-template-columns:1fr}
  .hero__art{min-height:300px;margin:4px calc(-1 * var(--gutter)) 0;order:2}
  .logos{gap:20px 30px}
  .logos img{height:calc(var(--h,30px) * .8)}
}

/* ---------- Statement (velký text) ---------- */
.statement{font:500 var(--t-statement)/1.1 var(--f-display);letter-spacing:-.035em;max-width:20ch;text-wrap:balance}
.statement--wide{max-width:24ch}
.statement .w{transition:opacity .25s linear}
.points{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px clamp(1.5rem,4cqi,4rem);margin-top:clamp(3rem,2rem + 4cqi,6rem)}
.point{display:grid;gap:10px;align-content:start}
.point__q{width:28px;height:28px;color:var(--c-blue)}
.point h3{font-size:clamp(1.25rem,1.05rem + .6cqi,1.625rem)}
.point p{color:var(--c-ink-2)}
.b-ink .point p{color:var(--c-on-ink-2)}
.statement-foot{margin-top:clamp(2.5rem,2rem + 2cqi,4rem)}
@container site (max-width:767px){.points{grid-template-columns:1fr}}

/* ---------- Služby: 2 sloupce po 4 ---------- */
.svc2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:clamp(2rem,5cqi,5rem)}
.svc2__col{border-top:1px solid var(--c-line)}
.srow{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px 20px;align-items:center;padding:26px 16px 26px 0;border-bottom:1px solid var(--c-line);text-decoration:none;color:inherit;isolation:isolate;transition:padding var(--dur-3) var(--ease-out)}
.srow::before{content:"";position:absolute;inset:0 -16px;background:var(--c-tint);border-radius:var(--r-md);transform:scaleY(.6);opacity:0;transition:opacity var(--dur-2),transform var(--dur-3) var(--ease-out);z-index:-1}
.srow h3{font-size:clamp(1.375rem,1.1rem + .9cqi,2rem);transition:color var(--dur-2)}
.srow p{grid-column:1;color:var(--c-ink-2);font-size:.9375rem;max-width:48ch}
.srow__arrow{grid-row:1 / span 2;grid-column:2;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--c-line-strong);transition:all var(--dur-2) var(--ease-out)}
.srow__arrow svg{width:16px;height:16px}

.lead a:hover{color:var(--c-blue)}
@container site (max-width:767px){.svc2{grid-template-columns:1fr}.svc2__col+.svc2__col{border-top:0}}

/* ---------- Výroky (místo seznamů) ---------- */
.bigrows{border-top:1px solid var(--c-line-on-dark)}
.bigrow{display:grid;grid-template-columns:72px minmax(0,1.1fr) minmax(0,.9fr);gap:12px clamp(1.5rem,4cqi,4rem);align-items:baseline;padding:clamp(1.5rem,1rem + 1.5cqi,2.5rem) 0;border-bottom:1px solid var(--c-line-on-dark);transition:opacity var(--dur-3)}
.bigrow__n{font:500 .875rem/1 var(--f-mono);color:var(--c-blue-on-dark)}
.bigrow h3{font:500 var(--t-medium)/1.08 var(--f-display);letter-spacing:-.03em;transition:transform var(--dur-3) var(--ease-out)}
.bigrow p{color:var(--c-on-ink-2);max-width:44ch}
.bigrows:hover .bigrow{opacity:.45}
.bigrows .bigrow:hover{opacity:1}
.bigrow:hover h3{transform:translateX(8px)}
@container site (max-width:767px){.bigrow{grid-template-columns:1fr;gap:10px}.bigrows:hover .bigrow{opacity:1}}

/* ---------- Napojení (podpis Webflow vývoj) ---------- */
.flow{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:clamp(1rem,3cqi,3rem);align-items:center}
.flow__col{display:grid;gap:12px}
.node{display:flex;align-items:center;gap:12px;min-height:60px;padding:12px 16px;border-radius:var(--r-md);background:#fff;border:1px solid var(--c-line);font-weight:600;position:relative;z-index:1;transition:border-color var(--dur-2),transform var(--dur-2) var(--ease-out)}
.node small{display:block;font-weight:400;color:var(--c-ink-3);font-size:.8125rem}
.node__i{width:36px;height:36px;border-radius:10px;background:var(--c-tint);color:var(--c-blue);display:grid;place-items:center;flex:none}
.node__i svg{width:18px;height:18px}
.node--hub{background:var(--c-blue);color:#fff;border-color:var(--c-blue);min-height:120px;justify-content:center;flex-direction:column;text-align:center;font:600 1.25rem/1.2 var(--f-display)}
.node--hub small{color:var(--c-on-blue-2)}
.node:hover{border-color:var(--c-blue);transform:translateY(-2px)}
.flow__wires{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:visible}
.flow__wires path{fill:none;stroke:var(--c-tint-line);stroke-width:2}
.flow__wires .dot{fill:var(--c-blue)}
.flow-note{margin-top:28px;color:var(--c-ink-2);max-width:60ch}
@container site (max-width:767px){.flow{grid-template-columns:1fr}.flow__wires{display:none}.node--hub{min-height:88px}}

/* ---------- Naše práce: fullscreen při scrollu ---------- */
.works-sec{padding-bottom:0}
.works-sec .sh{margin-bottom:clamp(2rem,1rem + 3cqi,4rem)}
.works{position:relative}
.work{position:sticky;top:var(--tb-h);height:var(--vh);display:grid;padding:calc(var(--inset,1) * var(--gutter));padding-top:calc(var(--inset,1) * 12px);transition:none}
.work__card{--bg:var(--c-ink-soft);position:relative;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(1.5rem,4cqi,4rem);align-items:center;padding:clamp(1.5rem,1rem + 3cqi,4.5rem);border-radius:calc(var(--inset,1) * var(--r-lg));background:var(--bg);color:#fff;overflow:hidden;box-shadow:0 -24px 60px rgba(0,0,0,.25)}
.work:nth-child(2) .work__card{--bg:var(--c-blue-deep)}
.work:nth-child(3) .work__card{--bg:var(--c-blue)}
.work__text{display:grid;gap:22px;align-content:center;justify-items:start}
.work__logo{height:var(--h,30px);width:auto;filter:brightness(0) invert(1);opacity:.92}
.work__logo--raw{filter:none;opacity:1}
.work__h{font:500 var(--t-medium)/1.12 var(--f-display);letter-spacing:-.03em;text-wrap:balance;max-width:20ch}
.work__h span{color:var(--c-on-ink-2)}
.work__count{font:500 .8125rem/1 var(--f-mono);color:var(--c-on-ink-2)}
.work__link{color:#fff}
.mock{position:relative;border-radius:14px;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden;transform:perspective(1200px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s var(--ease-out);cursor:none}
.mock__bar{display:flex;align-items:center;gap:6px;height:34px;padding:0 14px;background:#F1F2F6;border-bottom:1px solid var(--c-line)}
.mock__bar i{width:9px;height:9px;border-radius:50%;background:#D5D8E2}
.mock__bar span{margin-left:12px;font:500 .75rem/1 var(--f-mono);color:var(--c-ink-3)}
.mock__view{position:relative;aspect-ratio:16/10;overflow:hidden;background:#E9EBF1}
.mock__view img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:loop 20s var(--ease-out) infinite;transform-origin:20% 20%}
@keyframes loop{0%,14%{transform:scale(1) translate(0,0)}24%,38%{transform:scale(1.6) translate(-14%,-6%)}48%,62%{transform:scale(1.55) translate(12%,-14%)}72%,86%{transform:scale(1.7) translate(-6%,-22%)}100%{transform:scale(1) translate(0,0)}}
.mock__tag{position:absolute;left:12px;bottom:12px;font:500 .6875rem/1 var(--f-mono);background:rgba(12,14,28,.78);color:#fff;padding:6px 8px;border-radius:6px}
.cursor{position:absolute;left:0;top:0;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;background:var(--c-blue);color:#fff;display:grid;place-items:center;text-align:center;font:600 .8125rem/1.15 var(--f-body);pointer-events:none;transform:translate(var(--cx,50%),var(--cy,50%)) scale(var(--cs,0));transition:transform .18s var(--ease-out);z-index:3}
@container site (max-width:860px){
  .work{position:relative;height:auto;padding:0 var(--gutter) 16px}
  .work__card{grid-template-columns:1fr;border-radius:var(--r-lg)}
  .mock{cursor:auto}
  .cursor{display:none}
}

/* ---------- Důvody ---------- */
.reasons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.reason{display:grid;gap:14px;align-content:start;padding:clamp(1.5rem,1rem + 1.2cqi,2.25rem);border-radius:var(--r-lg);background:var(--c-surface);transition:background-color var(--dur-3) var(--ease-out),transform var(--dur-3) var(--ease-out)}
.reason__i{width:56px;height:56px;display:grid;place-items:center;background:#fff;color:var(--c-blue);border-radius:14px;transition:border-radius var(--dur-4) var(--ease-out),background-color var(--dur-3),color var(--dur-3)}
.reason__i svg{width:26px;height:26px;transition:transform var(--dur-3) var(--ease-out)}
.reason h3{font-size:clamp(1.25rem,1.05rem + .6cqi,1.625rem);margin-top:14px}
.reason p{color:var(--c-ink-2)}
.reason:hover{background:var(--c-tint);transform:translateY(-4px)}
.reason:hover .reason__i{border-radius:0 0 0 100%;background:var(--c-blue);color:#fff}
.reason:hover .reason__i svg{transform:translate(4px,-4px) scale(.9)}
@container site (max-width:991px){.reasons{grid-template-columns:1fr 1fr}}
@container site (max-width:600px){.reasons{grid-template-columns:1fr}}

/* ---------- Reference ---------- */
.refs{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:clamp(2.5rem,6cqi,6rem);align-items:end}

.refs__who{display:flex;align-items:center;gap:18px;margin-top:32px;font-weight:600}
.refs__who img{height:22px;width:auto;filter:brightness(0) invert(1)}
.refs__who span{color:var(--c-on-blue-2);font-weight:400}
.partner{display:grid;gap:16px;align-content:start;padding:clamp(1.5rem,1rem + 1.5cqi,2.25rem);border-radius:var(--r-lg);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2)}

.partner p{color:var(--c-on-blue-2)}

/* ---------- Postup: krok za krokem ---------- */
.proc{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(2rem,6cqi,6rem);align-items:start}
.proc__side{position:sticky;top:calc(var(--tb-h) + 110px);display:grid;gap:28px;justify-items:start}
.proc__big{font:600 clamp(6rem,3rem + 10cqi,12rem)/.8 var(--f-display);letter-spacing:-.06em;color:var(--c-blue);display:flex;align-items:flex-end;gap:.08em}
.proc__big small{font:500 1rem/1 var(--f-mono);letter-spacing:0;color:var(--c-ink-3);margin-bottom:.6em}
.proc__bar{width:100%;max-width:320px;height:4px;border-radius:4px;background:var(--c-tint-line);overflow:hidden}
.proc__bar i{display:block;height:100%;width:calc(var(--pp,0) * 100%);background:var(--c-blue);border-radius:4px;transition:width .4s var(--ease-out)}
.steps{display:grid;border-top:1px solid var(--c-tint-line)}
.step{display:grid;grid-template-columns:56px minmax(0,1fr);gap:6px 18px;padding:clamp(1.5rem,1rem + 1.2cqi,2.25rem) 0;border-bottom:1px solid var(--c-tint-line);transition:opacity var(--dur-3)}
.step__n{font:600 1.5rem/1.1 var(--f-display);color:var(--c-ink-3);letter-spacing:-.03em;grid-row:span 2;transition:color var(--dur-3)}
.step h3{font:500 var(--t-medium)/1.1 var(--f-display);letter-spacing:-.03em;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.step__free{font:600 .8125rem/1 var(--f-body);letter-spacing:0;color:#fff;background:var(--c-blue);padding:7px 11px;border-radius:var(--r-pill)}
.step p{color:var(--c-ink-2);max-width:52ch;font-size:1.0625rem}
.js-motion .steps.is-live .step{opacity:.32}
.js-motion .steps.is-live .step.is-on{opacity:1}
.step.is-on .step__n{color:var(--c-blue)}
@container site (max-width:860px){.proc{grid-template-columns:1fr}.proc__side{position:static}.proc__big{display:none}.proc__bar{display:none}}

/* ---------- FAQ ---------- */
.faq-wrap{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(2rem,6cqi,6rem);align-items:start}
.faq-wrap .sh{margin:0;grid-template-columns:1fr}
.faq{border-top:1px solid var(--c-line);interpolate-size:allow-keywords}
.faq details{border-bottom:1px solid var(--c-line)}
.faq summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:20px;align-items:center;padding:20px 0;cursor:pointer;font:600 clamp(1.0625rem,1rem + .35cqi,1.25rem)/1.35 var(--f-display);min-height:44px}
.faq summary::-webkit-details-marker{display:none}
.faq summary:hover{color:var(--c-blue)}
.plus{width:44px;height:44px;border-radius:50%;border:1px solid var(--c-line-strong);position:relative;transition:background-color var(--dur-2),border-color var(--dur-2)}
.plus::before,.plus::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:1.5px;background:currentColor;transform:translate(-50%,-50%);transition:transform var(--dur-2)}
.plus::after{transform:translate(-50%,-50%) rotate(90deg)}
.faq details[open] .plus{background:var(--c-blue);border-color:var(--c-blue);color:#fff}
.faq details[open] .plus::after{transform:translate(-50%,-50%) rotate(0)}
.faq__a{padding:0 64px 22px 0;color:var(--c-ink-2)}
.faq details::details-content{block-size:0;overflow:clip;transition:block-size var(--dur-3) var(--ease-out),content-visibility var(--dur-3) allow-discrete}
.faq details[open]::details-content{block-size:auto}
@container site (max-width:860px){.faq-wrap{grid-template-columns:1fr}.faq__a{padding-right:0}}

/* ---------- CTA s formulářem ---------- */
.cta-big__grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px);gap:clamp(2.5rem,6cqi,6rem);align-items:start}
.cta-big__left{display:grid;gap:26px;align-content:start}
.cta-big h2{font-size:clamp(2.5rem,1rem + 4.6cqi,5.25rem);line-height:1;letter-spacing:-.045em;max-width:12ch}
.person{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:end;margin-top:12px}
.person img{width:clamp(148px,10rem + 4cqi,220px);aspect-ratio:1;border-radius:var(--r-lg);object-fit:cover;background:rgba(255,255,255,.18)}
.person__t{display:grid;gap:2px;font-size:.9375rem;color:var(--c-on-blue-2);padding-bottom:6px}

.form{background:#fff;color:var(--c-ink);border-radius:var(--r-md);padding:clamp(1.125rem,.9rem + 1cqi,1.75rem);display:grid;gap:16px;box-shadow:0 20px 60px rgba(8,10,60,.25)}
.form__fields{display:grid;gap:14px}

.field{display:grid;gap:6px;min-width:0}
.field label,.field legend{font-weight:600;font-size:.875rem;padding:0}
.input{width:100%;min-height:46px;padding:11px 13px;border-radius:8px;border:1px solid var(--c-line-strong);background:#fff;font:400 1rem/1.4 var(--f-body);color:var(--c-ink);transition:border-color var(--dur-1),box-shadow var(--dur-1)}
.input:hover{border-color:var(--c-ink-3)}
.input:focus{outline:none;border-color:var(--c-blue);box-shadow:0 0 0 3px var(--c-blue-100)}
textarea.input{min-height:104px;resize:vertical;position:relative;z-index:1;background:transparent}
.ta{position:relative;background:#fff;border-radius:8px}
.ta__ghost{position:absolute;inset:0;padding:12px 14px;color:#6F7488;font:400 1rem/1.4 var(--f-body);pointer-events:none;white-space:pre-wrap;overflow:hidden}
.ta__ghost::after{content:"";display:inline-block;width:1px;height:1.1em;background:currentColor;vertical-align:-.15em;margin-left:1px;animation:blink 1s steps(1) infinite}

.fstep{display:grid;gap:14px}

.fstep__foot{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.cal{border:1px solid var(--c-line);border-radius:12px;padding:14px;display:grid;gap:12px}

fieldset.field{border:0;margin:0;padding:0}

@container site (max-width:560px){.form__row{grid-template-columns:1fr}.cal__days{grid-template-columns:repeat(3,1fr)}.cal__day:nth-child(n+4){display:none}.person{grid-template-columns:1fr}}

/* ---------- Footer ---------- */
.foot{background:var(--c-ink);color:#fff;padding-block:clamp(4rem,2.5rem + 4cqi,6.5rem) 28px;overflow:hidden}

@container site (max-width:991px){.foot__top{grid-template-columns:1fr 1fr}.foot__brand{grid-column:1/-1}}
@container site (max-width:480px){.foot__top{grid-template-columns:1fr}}

/* ---------- Pohyb ---------- */

.w{display:inline-block;transition:transform .8s var(--ease-out),opacity .6s var(--ease-out)}

.lines-pre.lines-soft .w{opacity:1;transform:translateY(.25em)}

/* ---------- Názvy komponent (náhled) ---------- */

/* ============ KNIHOVNA ============ */
.lib{padding-block:clamp(3rem,2rem + 4cqi,6rem)}
.lib__intro{display:grid;gap:16px;max-width:780px;margin-bottom:clamp(3rem,2rem + 3cqi,5rem)}
.lib__intro h1{font-size:clamp(2.25rem,1rem + 3.4cqi,4rem)}
.lib-sec{padding-block:clamp(2.5rem,1.5rem + 3cqi,4rem);border-top:1px solid var(--c-line)}
.lib-sec>h2{font-size:clamp(1.75rem,1rem + 2cqi,2.5rem);margin-bottom:10px}
.lib-sec>.lead{margin-bottom:28px;max-width:72ch;font-size:1.0625rem}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sw{border:1px solid var(--c-line);border-radius:var(--r-sm);overflow:hidden}
.sw__c{height:72px}
.sw__m{padding:10px 12px;display:grid;gap:2px;font:400 .75rem/1.3 var(--f-mono);color:var(--c-ink-3)}
.sw__m strong{font-weight:500;color:var(--c-ink)}
.rhythm{display:grid;gap:14px}
.rhythm__row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
.rhythm__row b{font-size:.9375rem}
.rhythm__bar{display:flex;height:56px;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px var(--c-line)}
.rhythm__bar span{flex:1;display:grid;place-items:center;font:500 .6875rem/1.1 var(--f-mono);text-align:center;padding:4px;min-width:0;overflow:hidden}
.rules{display:grid;gap:10px;margin-top:24px;max-width:80ch}
.rules li{display:flex;gap:12px;color:var(--c-ink-2)}
.rules li::before{content:"";flex:none;width:10px;height:10px;margin-top:.5em;background:var(--c-blue);border-radius:0 0 0 100%}
.tscale{border-top:1px solid var(--c-line)}
.tscale__row{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;padding:18px 0;border-bottom:1px solid var(--c-line);align-items:baseline}
.tscale__row code{font:400 .75rem/1.5 var(--f-mono);color:var(--c-ink-3);display:block}
.label{font:500 .75rem/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--c-ink-3)}
.states{display:flex;flex-wrap:wrap;gap:20px 16px;align-items:center}
.state{display:grid;gap:10px;justify-items:start}
.state--blue{background:var(--c-blue);padding:16px;border-radius:var(--r-sm)}
.state--blue .label{color:var(--c-on-blue-2)}
.twrap{overflow-x:auto;border:1px solid var(--c-line);border-radius:var(--r-sm)}
.ttable{width:100%;border-collapse:collapse;font-size:.875rem;min-width:860px}
.ttable th,.ttable td{text-align:left;padding:12px;border-bottom:1px solid var(--c-line);vertical-align:top}
.ttable thead th{font:500 .6875rem/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--c-ink-3);background:var(--c-surface)}
.ttable tbody th{font-weight:600}
.ttable td{color:var(--c-ink-2)}
.ttable tr:last-child>*{border-bottom:0}
.ttable i.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;box-shadow:inset 0 0 0 1px rgba(12,14,28,.2)}
.gone{display:flex;flex-wrap:wrap;gap:8px}
.gone span{padding:6px 12px;border-radius:var(--r-pill);background:var(--c-surface);color:var(--c-ink-3);text-decoration:line-through;font-size:.875rem}
.lib-faq{border:1px dashed var(--c-line-strong);border-radius:var(--r-lg);overflow:hidden}
@container site (max-width:767px){.tscale__row,.rhythm__row{grid-template-columns:1fr;gap:6px}}

@media (prefers-reduced-motion: reduce){
  .site *,.site *::before,.site *::after{transition-duration:1ms!important;animation:none!important}
}
.rm-force .site *,.rm-force .site *::before,.rm-force .site *::after{transition-duration:1ms!important;animation:none!important}
</style>

<script>
(() => {
'use strict';
/* ============ Ikony ============ */
const sv = (d, w=2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I = {
  arrow: sv('<path d="M5 12h14M13 6l6 6-6 6"/>'),
  arrowUR: sv('<path d="M7 17 17 7M8 7h9v9"/>'),
  chev: sv('<path d="m6 9 6 6 6-6"/>'),
  li: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>',
  /* ikony důvodů */
  years: sv('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),
  target: sv('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/>'),
  pen: sv('<path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/><path d="M14 6l3 3"/>'),
  layers: sv('<path d="M12 3 2 8l10 5 10-5-10-5z"/><path d="m2 13 10 5 10-5"/>'),
  route: sv('<circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/>'),
  scale: sv('<path d="M4 7h16M7 7l-3 7a3 3 0 0 0 6 0L7 7zM17 7l-3 7a3 3 0 0 0 6 0l-3-7zM12 4v16M8 20h8"/>'),
  /* ikony napojení */

  cart: sv('<path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/>'),
  chart: sv('<path d="M4 19V5M4 19h16M8 15l3-4 3 2 5-6"/>'),
  crm: sv('<circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0M16 4.5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 5"/>'),
  mail: sv('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>'),
  table: sv('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/>'),
  code: sv('<path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/>')
};
const SYMBOL = '<svg viewBox="0 0 200 200" aria-hidden="true"><path fill="currentColor" d="M0 0H100V100A100 100 0 0 1 0 0ZM100 0H200V100A100 100 0 0 1 100 0ZM0 100H100V200H0ZM100 100H200V200A100 100 0 0 1 100 100Z"/></svg>';
const QUARTER = '<svg viewBox="0 0 100 100" aria-hidden="true"><path fill="currentColor" d="M0 0H100V100A100 100 0 0 1 0 0Z"/></svg>';
const logo = () => `<a class="logo" href="#home" data-go="home" aria-label="Webkit.Studio, domů">${SYMBOL}<span>Webkit.Studio</span></a>`;
const LI_PERSON = 'https://www.linkedin.com/in/svoboda-lukas/';
const LI_COMPANY = 'https://www.linkedin.com/company/webkit-studio-prague';

/* ============ Pomocníci ============ */
// *text* = modré zvýraznění, {text} = návrh k potvrzení (tečkovaně), [DOPLNIT: …] = žlutý štítek chybějícího faktu
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const t = s => esc(s)
  .replace(/\*([^*]+)\*/g,'<span class="hl">$1</span>')
  .replace(/\{([^}]+)\}/g,'<span class="nv" title="Návrh, potvrdí Lukáš">$1</span>')
  .replace(/\[DOPLNIT([^\]]*)\]/g,'<mark class="fill">[DOPLNIT$1]</mark>');
const attrs = o => Object.entries(o).filter(([,v])=>v!=null&&v!==false).map(([k,v])=>v===true?k:`${k}="${esc(v)}"`).join(' ');
const btn = (label, {href='#kontakt', v='primary', size='', extra='', submit=false}={}) => submit ?
  `<button type="submit" class="btn ${extra}"><span class="btn__label"><span data-t="${esc(label)}">${esc(label)}</span></span><span class="btn__disc">${I.arrow}${I.arrow}</span></button>` :
  `<a class="btn ${v!=='primary'?'btn--'+v:''} ${size?'btn--'+size:''} ${extra}" href="${href}"><span class="btn__label"><span data-t="${esc(label)}">${esc(label)}</span></span><span class="btn__disc">${I.arrow}${I.arrow}</span></a>`;
// Sekce: komponenta, varianta, barva bloku (white | tint | ink | blue)
const sec = (comp, variant, block, inner, {cls='', id='', hidden=false}={}) =>
  `<section class="sec b-${block} ${cls}" ${attrs({id:id||null,'data-comp':comp,'data-block':block,'data-label':comp+(variant?' / '+variant:'')+' · blok '+BLOCK_NAME[block]+(hidden?' · skryté':''),hidden})}>${inner}</section>`;
const BLOCK_NAME = {white:'bílá', tint:'tón', ink:'ink', blue:'modrá'};
const BLOCK_COLOR = {white:'#FFFFFF', tint:'#EEF2FF', ink:'#0C0E1C', blue:'#1D2BE8'};
const sh = ({h, lead, solo=false, tag='h2'}) =>
  `<div class="sh ${solo||!lead?'sh--solo':''}" data-reveal><${tag} data-lines>${t(h)}</${tag}>${lead?`<div class="sh__side"><p class="lead">${lead}</p></div>`:''}</div>`;

/* Služby: pořadí podle Lukáše (levý sloupec weby, pravý ostatní). Pozicování podle bodů 10 až 15. */
const SERVICES = [
  {h:'Tvorba webových stránek', p:'Web s jasným cílem: od strategie a textů po design, vývoj a měření. Postavený tak, aby z návštěvníků dělal zákazníky.'},
  {h:'Webflow vývoj', go:'webflow', p:'Webflow partner. Čistá struktura, napojení na CRM a automatizace, vlastní kód tam, kde Webflow nestačí.'},
  {h:'Redesign webu', p:'Redesign, který vychází z dat a cílů firmy. Nový vzhled je výsledek, ne zadání.'},
  {h:'Landing page', p:'Stránka pro kampaň nebo produkt, spuštěná rychle a postavená na konverze. Měříme ji od prvního dne.'},
  {h:'UX audit', p:'Najdeme místa, kde zákazníci odcházejí, a seřadíme úpravy podle dopadu.'},
  {h:'Vývoj MVP', p:'První funkční verze produktu za týdny, ne měsíce. Nápad ověříte dřív, než do něj investujete víc.'},
  {h:'Vývoj webových aplikací', p:'Interní nástroje i aplikace pro vaše zákazníky. Od přechodu z tabulek přes testování a zpětnou vazbu po provoz.'},
  {h:'Vizuální identita', p:'Vizuální systém, který váš tým snadno používá. Na webu, v prezentacích i na sociálních sítích.'}
];
const svcHref = s => s.go ? `href="#${s.go}" data-go="${s.go}"` : 'href="#" data-soon';

const LOGOS = [
  {k:'marv', n:'MARV Travel', src:'img/logos/marv.png', h:34},
  {k:'eldr', n:'Elektro Drapač (ELDR)', src:'img/logos/eldr.png', h:36},
  {k:'crr', n:'Centrum pro regionální rozvoj ČR', src:'img/logos/crr.svg', h:42},
  {k:'arbosis', n:'Arbosis', src:'img/logos/arbosis.svg', h:28},
  {k:'anse', n:'Anse', src:'img/logos/anse.png', h:26}
];
const logoStrip = () => `<ul class="logos" aria-label="Klienti" data-reveal>${LOGOS.map(l=>`<li><img src="${l.src}" alt="${esc(l.n)}" style="--h:${l.h}px" loading="lazy"></li>`).join('')}</ul>`;

const WORK = {
  eldr:{logo:'img/logos/eldr.png', lh:34, name:'Elektro Drapač', h:'Nový web, který vedl růst na německý trh.', h2:'Navrhli jsme ho a postavili ve Webflow.', url:'https://www.eldr.cz/', host:'eldr.cz', img:'img/web-eldr.jpg'},
  crr:{logo:'img/logos/crr-white.svg', lh:44, raw:true, name:'CRR', h:'Jednotný vizuální styl a šablony pro celou instituci.', h2:'[DOPLNIT: jedna věta s výsledkem]', url:'https://crr.gov.cz/', host:'crr.gov.cz', img:'img/web-crr.jpg'},
  arb:{logo:'img/logos/arbosis.svg', lh:30, name:'Arbosis', h:'Značka zahradní firmy od logiky loga po polep aut.', h2:'[DOPLNIT: jedna věta s výsledkem]', url:'https://www.arbosis.cz/', host:'arbosis.cz', img:'img/web-arb.jpg'}
};

/* ============ Sekční komponenty ============ */
const C = {};
C.nav = page => {
  const cur = k => page===k ? 'aria-current="page"' : '';
  return `<header class="nav" data-comp="Navbar" data-label="Navbar" id="nav">
  <div class="container nav__in">
    ${logo()}
    <nav class="nav__links" aria-label="Hlavní">
      <button class="nav__link" aria-expanded="false" aria-controls="menu" data-menu>Služby ${I.chev}</button>

const facts = () => `<div class="facts" data-reveal>

C.bigrows = p => sec('Výroky','Velké řádky místo seznamu','ink',`<div class="container">

C.work = p => sec('Naše práce', p.ids.length>1?'Fullscreen při scrollu ('+p.ids.length+')':'Fullscreen, 1 projekt','ink',`<div class="container">${sh({h:p.h})}</div>
  <div class="works">${p.ids.map((id,i)=>{const x=WORK[id];return `<article class="work" data-work>
    <div class="work__card">
      <div class="work__text">
        <img class="work__logo ${x.raw?'work__logo--raw':''}" src="${x.logo}" alt="${esc(x.name)}" style="--h:${x.lh}px">
        <h3 class="work__h">${t(x.h)} <span>${t(x.h2)}</span></h3>
        <a class="link link--arrow work__link" href="${x.url}" target="_blank" rel="noopener">${esc(x.host)} ${I.arrowUR}</a>
        ${p.ids.length>1?`<span class="work__count" aria-hidden="true">${String(i+1).padStart(2,'0')} / ${String(p.ids.length).padStart(2,'0')}</span>`:''}
      </div>
      <div class="mock" data-mock>
        <div class="mock__bar" aria-hidden="true"><i></i><i></i><i></i><span>${esc(x.host)}</span></div>
        <div class="mock__view">
          <!-- Ve Webflow: <video autoplay muted loop playsinline poster="…"> se zdroji MP4 a WebM, 20s smyčka. Tady zástupná smyčka ze snímku. -->
          <img src="${x.img}" alt="Ukázka projektu ${esc(x.name)}" width="1600" height="900">
          <span class="mock__tag" aria-hidden="true">zástupná smyčka</span>
        </div>
        <span class="cursor" aria-hidden="true">Prozkoumat<br>projekt</span>

function render(page){

function setTbH(){ const h = document.getElementById('pv').getBoundingClientRect().height; document.documentElement.style.setProperty('--tb-h', (h/zoom)+'px'); }

function initNav(){
  const nav = site.querySelector('#nav'); if(!nav) return;
  const menu = nav.querySelector('.menu');
  const triggers = nav.querySelectorAll('[data-menu],[data-burger]');
  const burger = nav.querySelector('[data-burger]');
  const setOpen = open => {
    menu.classList.toggle('is-open', open); nav.classList.toggle('is-open', open);
    triggers.forEach(tr=>tr.setAttribute('aria-expanded', String(open)));
    burger.setAttribute('aria-label', open?'Zavřít menu':'Otevřít menu');
  };
  let opener = null;
  triggers.forEach(tr=>tr.addEventListener('click',()=>{ opener = tr; setOpen(!menu.classList.contains('is-open')); }));
  const onKey = e => { if(e.key==='Escape' && menu.classList.contains('is-open')){ setOpen(false); (opener && opener.offsetParent ? opener : burger).focus(); } };
  document.addEventListener('keydown', onKey); onCleanup(()=>document.removeEventListener('keydown', onKey));
  menu.addEventListener('click', e=>{ if(e.target.closest('a')) setOpen(false); });
  let lastY = window.scrollY, acc = 0;
  const onScroll = () => {
    const y = window.scrollY, dy = y - lastY; lastY = y;
    nav.classList.toggle('is-scrolled', y > 8);
    if(menu.classList.contains('is-open')) return;
    if(y < 120){ nav.classList.remove('is-hidden'); acc=0; return; }
    acc = (Math.sign(dy)===Math.sign(acc)) ? acc+dy : dy;
    if(acc > 40) nav.classList.add('is-hidden'); else if(acc < -30) nav.classList.remove('is-hidden');
  };
  window.addEventListener('scroll', onScroll, {passive:true}); onCleanup(()=>window.removeEventListener('scroll', onScroll));
}

function scrollToEl(el){
  const y = el.getBoundingClientRect().top + window.scrollY - (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tb-h'))||0)*zoom + 2;
  window.scrollTo({top:y, behavior: reduced?'auto':'smooth'});
}

const EXAMPLES = [
  'Chceme víc poptávek z webu a nevíme, kde začít.',
  'Potřebujeme Webflow web napojený na naše CRM.',
  'Máme nápad na aplikaci a potřebujeme první verzi.',
  'Logo a barvy už neodpovídají tomu, kdo jsme.',

];
function initTypewriter(wrap){
  const ta = wrap.querySelector('textarea'); const ghost = wrap.querySelector('.ta__txt');
  const sync = () => wrap.classList.toggle('is-typing', ta.value.length>0 || document.activeElement===ta);
  ['input','focus','blur'].forEach(ev=>ta.addEventListener(ev, sync)); sync();
  ta.setAttribute('aria-description', 'Například: ' + EXAMPLES[0]);
  if(reduced){ ghost.textContent = EXAMPLES[0]; return; }
  let i=0, n=0, del=false, alive=true, tm;
  const step = () => { if(!alive) return; const s = EXAMPLES[i];
    if(!del){ n++; ghost.textContent = s.slice(0,n); if(n===s.length){ del=true; tm=setTimeout(step,2400); return; } tm=setTimeout(step,32); }
    else { n-=3; if(n<=0){ n=0; del=false; i=(i+1)%EXAMPLES.length; ghost.textContent=''; tm=setTimeout(step,400); return; } ghost.textContent = s.slice(0,n); tm=setTimeout(step,12); } };
  step(); onCleanup(()=>{ alive=false; clearTimeout(tm); });
}

function calendar(box, onPick){
  const d = new Date(); const days=[];
  while(days.length<5){ d.setDate(d.getDate()+1); if(d.getDay()!==0 && d.getDay()!==6) days.push(new Date(d)); }
  const dn = ['Ne','Po','Út','St','Čt','Pá','So'];
  box.innerHTML = `<div class="cal__head">Úvodní hovor online, {50 minut}</div>
    <div class="cal__days" role="group" aria-label="Den">${days.map((x,i)=>`<button type="button" class="cal__day" aria-pressed="${i===0}">${dn[x.getDay()]}<b>${x.getDate()}. ${x.getMonth()+1}.</b></button>`).join('')}</div>
    <div class="cal__slots" role="group" aria-label="Čas">${['9:00','10:30','13:00','15:30'].map(s=>`<button type="button" class="chip">${s}</button>`).join('')}</div>`;
  box.querySelector('.cal__head').innerHTML = t('Úvodní hovor online, {50 minut}');
  box.querySelectorAll('.cal__day').forEach(b=>b.addEventListener('click',()=>box.querySelectorAll('.cal__day').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))));
  box.querySelectorAll('.cal__slots .chip').forEach(b=>b.addEventListener('click',()=>{ const day = box.querySelector('.cal__day[aria-pressed="true"] b').textContent; onPick(`${day} v ${b.textContent}`); }));
}

function initForms(){
  site.querySelectorAll('[data-form]').forEach(f=>{
    const wrap = f.querySelector('[data-ta]'); if(wrap) initTypewriter(wrap);
    const steps = n => f.querySelectorAll('[data-step]').forEach(s=>{ s.hidden = s.dataset.step!==String(n); });
    const go = n => { steps(n); const h = f.querySelector(`[data-step="${n}"] h3`); if(h) h.focus({preventScroll:false}); };
    let booked = '';
    const toQuestions = () => { go(3); };
    const done = () => { go(4); if(booked) f.querySelector('[data-done-text]').textContent = `Hovor máte ${booked}. Pozvánku najdete v e-mailu.`; };
    const submit = f.querySelector('.js-submit');
    f.addEventListener('submit', e=>{
      e.preventDefault();
      let ok = true;
      f.querySelectorAll('[data-step="1"] [required]').forEach(inp=>{
        const field = inp.closest('.field'); const bad = !inp.value.trim() || (inp.type==='email' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(inp.value));
        field.classList.toggle('is-error', bad); inp.setAttribute('aria-invalid', String(bad));
        const msg = field.querySelector('.field__msg');
        msg.textContent = !bad ? '' : inp.type==='email' ? 'Doplňte celý e-mail, např. jan@firma.cz' : inp.id==='firma' ? 'Napište název firmy.' : 'Tohle pole potřebujeme vyplnit.';
        if(bad && ok){ ok=false; inp.focus(); }
      });
      if(!ok) return;
      submit.classList.add('is-loading');
      setTimeout(()=>{
        submit.classList.remove('is-loading');
        gtag('generate_lead',{form_name:'Poptávka z homepage', page_type:current});
        go(2); gtag('booking_view');
        calendar(f.querySelector('[data-cal]'), slot => { booked = slot; gtag('booking_complete',{slot_day:slot}); toQuestions(); });
      }, 600);
    });
    f.querySelector('[data-skip="2"]').addEventListener('click',()=>{ gtag('booking_skip'); toQuestions(); });
    f.querySelector('[data-skip="3"]').addEventListener('click',()=>{ gtag('questionnaire_skip'); done(); });
    f.querySelector('.js-q-send').addEventListener('click',e=>{ e.preventDefault(); const tp = f.querySelector('[data-topic][aria-pressed="true"]'); gtag('questionnaire_complete',{topic: tp?tp.dataset.topic:'none'}); done(); });
    let started = false;
    f.querySelector('[data-step="3"]').addEventListener('click', e=>{
      const c = e.target.closest('.chip'); if(!c) return;
      if(!started){ started = true; gtag('questionnaire_start'); }
      const group = c.parentElement; group.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed', String(x===c)));
      if(c.dataset.topic) f.querySelectorAll('[data-qtopic]').forEach(q=>{ q.hidden = q.dataset.qtopic!==c.dataset.topic; });
    });
    // Na stránce služby je téma předvybrané
    if(current==='webflow'){ const c = f.querySelector('[data-topic="webflow"]'); c.setAttribute('aria-pressed','true'); f.querySelector('[data-qtopic="webflow"]').hidden = false; }
  });
}

(function initAnchors(){

    const variant = cv.dataset.field;
    const COLORS = {b:'#1D2BE8', s:'#DCE4FF', i:'#0C0E1C', t:'#EEF2FF'};
    let W=0, H=0, cell=64, tiles=[], raf=0, visible=true, ptr=null, last=0, time=0;
    // deterministická „náhoda“, aby kompozice byla pokaždé stejná
    let seed = variant==='home'?7:13; const rnd = () => (seed = (seed*16807)%2147483647)/2147483647;
    const build = () => {
      const r = cv.getBoundingClientRect(); const dpr = Math.min(2, window.devicePixelRatio||1);
      W = r.width/zoom; H = r.height/zoom; if(!W||!H) return;
      cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
      cell = W < 500 ? 46 : 70;
      const cols = Math.ceil(W/cell)+1, rows = Math.ceil(H/cell)+1;
      seed = variant==='home'?7:13; tiles = [];
      for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
        const edge = W>=500 ? x/cols : 1;            // vlevo řidší okraj, ať pole „vrůstá“ do textu
        const pEmpty = W>=500 ? Math.max(0, .55 - edge*1.1) : .08;
        const r1 = rnd(), r2 = rnd();
        if(r1 < pEmpty) continue;
        const kind = r2 < .1 ? 'sq' : 'q';
        const col = r2 < .58 ? 'b' : r2 < .8 ? 's' : r2 < .9 ? 'i' : 't';
        const base = Math.floor(rnd()*4);
        tiles.push({x:x*cell, y:y*cell, kind, col, a:base*Math.PI/2, tg:base*Math.PI/2, base, s:1, ts:1});
      }
      draw();
    };
    const draw = () => {
      ctx.clearRect(0,0,W,H);
      for(const tl of tiles){
        const c = cell, h = c/2;
        ctx.save(); ctx.translate(tl.x+h, tl.y+h); ctx.rotate(tl.a); ctx.scale(tl.s, tl.s);
        ctx.fillStyle = COLORS[tl.col]; ctx.beginPath();
        if(tl.kind==='sq'){ ctx.rect(-h,-h,c,c); }
        else { ctx.moveTo(-h,-h); ctx.lineTo(h,-h); ctx.lineTo(h,h); ctx.arc(h,-h,c,Math.PI/2,Math.PI,false); ctx.closePath(); }
        ctx.fill(); ctx.restore();
      }
    };
    const near = (cur, target) => { const q = Math.PI/2; let d = target - cur; d = ((d % (2*Math.PI)) + 3*Math.PI) % (2*Math.PI) - Math.PI; return cur + Math.round(d/q)*q; };
    const step = now => {
      raf = 0; if(!visible || reduced) return;
      const dt = Math.min(50, now - (last||now)); last = now; time += dt;
      let px, py, active = !!ptr;
      if(ptr){ px = ptr.x; py = ptr.y; }
      else { px = W*(.55 + .35*Math.cos(time/3100)); py = H*(.5 + .4*Math.sin(time/2300)); }
      let moving = false;
      for(const tl of tiles){
        const cx = tl.x+cell/2, cy = tl.y+cell/2, dx = px-cx, dy = py-cy, dist = Math.hypot(dx,dy);
        const reach = active ? 260 : 190;
        const k = Math.max(0, 1 - dist/reach);
        // natočení: dlaždice v dosahu „koukají“ ke kurzoru, ostatní se vrací do základní polohy
        const look = Math.round((Math.atan2(dy,dx) + Math.PI*.75) / (Math.PI/2)) * Math.PI/2;
        const want = k > .05 ? look : tl.base*Math.PI/2;
        tl.tg = near(tl.tg, want);
        tl.ts = 1 - k*.32;
        tl.a += (tl.tg - tl.a) * .14; tl.s += (tl.ts - tl.s) * .16;
        if(Math.abs(tl.tg-tl.a) > .002 || Math.abs(tl.ts-tl.s) > .002) moving = true;
      }
      draw();
      raf = requestAnimationFrame(step);
    };
    const kick = () => { if(!raf && visible && !reduced){ last = 0; raf = requestAnimationFrame(step); } };
    const toLocal = e => { const r = cv.getBoundingClientRect(); return {x:(e.clientX - r.left)/zoom, y:(e.clientY - r.top)/zoom}; };
    const onMove = e => { if(e.pointerType==='touch') return; ptr = toLocal(e); kick(); };
    const onLeave = () => { ptr = null; };
    const host = cv.closest('.hero');
    host.addEventListener('pointermove', onMove); host.addEventListener('pointerleave', onLeave);
    const io = new IntersectionObserver(es=>{ visible = es[0].isIntersecting; if(visible) kick(); else if(raf){ cancelAnimationFrame(raf); raf=0; } });
    io.observe(cv);
    const ro = new ResizeObserver(()=>build()); ro.observe(cv);
    build(); kick();
    onCleanup(()=>{ io.disconnect(); ro.disconnect(); if(raf) cancelAnimationFrame(raf); host.removeEventListener('pointermove', onMove); host.removeEventListener('pointerleave', onLeave); });
  });
}

/* ---------- Napojení: linky a putující body ---------- */
function initFlow(){
  site.querySelectorAll('[data-flow]').forEach(fl=>{
    const svg = fl.querySelector('.flow__wires'); const hub = fl.querySelector('[data-hub]');
    let raf = 0, alive = true;
    const layout = () => {
      const R = fl.getBoundingClientRect(); if(!R.width) return;
      const hr = hub.getBoundingClientRect();
      const P = el => el.getBoundingClientRect();
      const paths = [];
      fl.querySelectorAll('[data-from]').forEach(n=>{ const r=P(n); const x1=(r.right-R.left)/zoom, y1=(r.top+r.height/2-R.top)/zoom, x2=(hr.left-R.left)/zoom, y2=(hr.top+hr.height/2-R.top)/zoom; paths.push(`M${x1} ${y1} C${(x1+x2)/2} ${y1} ${(x1+x2)/2} ${y2} ${x2} ${y2}`); });
      fl.querySelectorAll('[data-to]').forEach(n=>{ const r=P(n); const x1=(hr.right-R.left)/zoom, y1=(hr.top+hr.height/2-R.top)/zoom, x2=(r.left-R.left)/zoom, y2=(r.top+r.height/2-R.top)/zoom; paths.push(`M${x1} ${y1} C${(x1+x2)/2} ${y1} ${(x1+x2)/2} ${y2} ${x2} ${y2}`); });
      svg.innerHTML = paths.map((d,i)=>`<path d="${d}" id="fw${i}"/>`).join('') + (reduced?'':paths.map((d,i)=>`<circle class="dot" r="4"><animateMotion dur="${2.4+(i%3)*.5}s" begin="${(i%3)*.6 + (i>2?1.2:0)}s" repeatCount="indefinite"><mpath href="#fw${i}"/></animateMotion></circle>`).join(''));
    };
    const ro = new ResizeObserver(()=>{ cancelAnimationFrame(raf); raf = requestAnimationFrame(layout); }); ro.observe(fl);
    layout();
    onCleanup(()=>{ alive=false; ro.disconnect(); cancelAnimationFrame(raf); });
  });
}

/* ---------- Kurzor a natočení ukázky projektu ---------- */
function initMocks(){
  if(reduced) return;
  site.querySelectorAll('[data-mock]').forEach(m=>{
    const cur = m.querySelector('.cursor');
    const move = e => { if(e.pointerType==='touch') return; const r = m.getBoundingClientRect(); const x=(e.clientX-r.left)/zoom, y=(e.clientY-r.top)/zoom;
      m.style.setProperty('--cx', x+'px'); m.style.setProperty('--cy', y+'px'); m.style.setProperty('--cs', 1);
      m.style.setProperty('--ry', ((x/(r.width/zoom))-.5)*6+'deg'); m.style.setProperty('--rx', (.5-(y/(r.height/zoom)))*5+'deg'); };
    const leave = () => { m.style.setProperty('--cs', 0); m.style.setProperty('--rx','0deg'); m.style.setProperty('--ry','0deg'); };
    m.addEventListener('pointermove', move); m.addEventListener('pointerleave', leave);
  });
}

/* ---------- Scroll: výrok po slovech, fullscreen projekty, krok za krokem ---------- */
function initScroll(){
  const scrubs = [...site.querySelectorAll('[data-scrub]')];
  scrubs.forEach(el=>{ splitWords(el); });
  const works = [...site.querySelectorAll('[data-work]')];
  const stepsEl = site.querySelector('[data-steps]');
  const stepItems = stepsEl ? [...stepsEl.children] : [];
  const procN = site.querySelector('[data-proc-n]'); const procBar = site.querySelector('.proc__bar');
  if(reduced){ scrubs.forEach(el=>el.querySelectorAll('.w').forEach(w=>w.style.opacity='')); works.forEach(w=>w.style.setProperty('--inset',0)); return; }
  if(stepsEl) stepsEl.classList.add('is-live');
  let ticking = false;
  const update = () => {
    ticking = false;
    const vh = window.innerHeight; const tb = (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tb-h'))||0)*zoom;
    scrubs.forEach(el=>{
      const r = el.getBoundingClientRect(); const ws = el._ws || (el._ws = [...el.querySelectorAll('.w')]);
      const p = Math.max(0, Math.min(1, (vh*.82 - r.top) / (r.height + vh*.32)));
      const n = ws.length;
      ws.forEach((w,i)=>{ const o = Math.max(0, Math.min(1, p*n*1.15 - i)); w.style.opacity = (.22 + .78*o).toFixed(3); });
    });
    works.forEach(w=>{
      if(getComputedStyle(w).position!=='sticky'){ w.style.setProperty('--inset',0); return; }
      const r = w.getBoundingClientRect(); const avail = vh - tb;
      // Karta se roztahuje, jak dojíždí k hornímu okraji: 1 = s okrajem, 0 = přes celou obrazovku
      const p = Math.max(0, Math.min(1, (r.top - tb) / (avail*.6)));
      w.style.setProperty('--inset', p.toFixed(3));
    });
    if(stepItems.length){
      let on = 0; stepItems.forEach((s,i)=>{ if(s.getBoundingClientRect().top < vh*.6) on = i; });
      stepItems.forEach((s,i)=>s.classList.toggle('is-on', i===on));
      if(procN) procN.textContent = String(on+1).padStart(2,'0');
      if(procBar) procBar.style.setProperty('--pp', ((on+1)/stepItems.length).toFixed(3));
    }
  };
  const onScroll = () => { if(!ticking){ ticking = true; requestAnimationFrame(update); } };
  window.addEventListener('scroll', onScroll, {passive:true}); window.addEventListener('resize', onScroll);
  onCleanup(()=>{ window.removeEventListener('scroll', onScroll); window.removeEventListener('resize', onScroll); });
  document.fonts.ready.then(update); update();
}

/* ---------- Řádky nadpisů + reveal ---------- */
let io;
function splitWords(el){
  if(el.dataset.split) return;
  const walk = node => {
    [...node.childNodes].forEach(n=>{
      if(n.nodeType===3){
        const frag = document.createDocumentFragment();
        n.textContent.split(/(\s+)/).forEach(p=>{ if(!p) return; if(/^\s+$/.test(p)) frag.appendChild(document.createTextNode(p)); else { const s=document.createElement('span'); s.className='w'; s.textContent=p; frag.appendChild(s);} });
        n.replaceWith(frag);
      } else if(n.nodeType===1 && !n.classList.contains('fill')) walk(n);
      else if(n.nodeType===1) n.classList.add('w');
    });
  };
  walk(el); el.dataset.split='1';
}
function playLines(el){
  if(reduced) return;
  splitWords(el);
  const ws = [...el.querySelectorAll('.w')]; if(!ws.length) return;
  ws.forEach(w=>{w.style.transition='none'}); el.classList.add('lines-pre'); void el.offsetWidth;
  let top = null, line = -1;
  ws.forEach(w=>{ const tp = w.offsetTop; if(top===null || Math.abs(tp-top)>4){ line++; top=tp; } w.style.transition=''; w.style.transitionDelay=(line*80)+'ms'; });
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.remove('lines-pre')));
}
function initMotion(root){
  if(io) io.disconnect();
  document.documentElement.classList.toggle('js-motion', !reduced);
  if(reduced) return;
  const vh = window.innerHeight;
  io = new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(!en.isIntersecting) return;
      const el = en.target; io.unobserve(el);
      if(el.hasAttribute('data-lines')){ document.fonts.ready.then(()=>playLines(el)); return; }
      const sibs = el.parentElement ? [...el.parentElement.children].filter(c=>c.hasAttribute('data-reveal')) : [el];
      setTimeout(()=>el.classList.remove('is-pre'), Math.min(Math.max(0,sibs.indexOf(el)),6)*70);
    });
  },{threshold:0.1, rootMargin:'0px 0px -5% 0px'});
  root.querySelectorAll('[data-reveal]').forEach(el=>{
    if(el.closest('[hidden]')) return;
    const r = el.getBoundingClientRect();
    if(r.top < vh*0.92 && r.bottom > 0) return;
    el.classList.add('is-pre'); io.observe(el);
  });
  root.querySelectorAll('[data-lines]').forEach(el=>{
    const r = el.getBoundingClientRect();
    if(r.top < vh && r.bottom > 0){ el.classList.add('lines-soft'); document.fonts.ready.then(()=>playLines(el)); }
    else io.observe(el);
  });
}

/* Lišta náhledu */
function applyWidth(w){
  stage.className = 'stage' + (w==='fit' ? ' stage--fit' : ' stage--w'+w);
  document.querySelectorAll('.pv__seg button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.w===w)));
  zoom = 1;
  if(w==='1440'){ const avail = document.documentElement.clientWidth - 32; zoom = Math.min(1, avail/1440); }
  frame.style.setProperty('--zoom', zoom);
  setTbH();
  try{ localStorage.setItem('wk-pv-w', w); }catch(e){}
}
document.querySelectorAll('.pv__seg button').forEach(b=>b.addEventListener('click',()=>{ applyWidth(b.dataset.w); render(current); }));
document.querySelectorAll('.pv__tab').forEach(b=>b.addEventListener('click',()=>{ location.hash = b.dataset.page; }));
document.getElementById('pv-labels').addEventListener('change', e=>site.classList.toggle('show-labels', e.target.checked));
document.getElementById('pv-rm').addEventListener('change', e=>{ reduced = e.target.checked || rmQuery.matches; document.body.classList.toggle('rm-force', e.target.checked); render(current); });
rmQuery.addEventListener && rmQuery.addEventListener('change', ()=>{ reduced = rmQuery.matches || document.getElementById('pv-rm').checked; render(current); });
window.addEventListener('resize', ()=>{ const w = document.querySelector('.pv__seg button[aria-pressed="true"]').dataset.w; if(w==='1440') applyWidth('1440'); else setTbH(); });
const pages = ['home','webflow','komponenty'];
const fromHash = () => { const h = location.hash.replace('#',''); return pages.includes(h) ? h : null; };
window.addEventListener('hashchange', ()=>{ const p = fromHash(); if(p && p!==current) render(p); });
let w0 = 'fit'; try{ w0 = localStorage.getItem('wk-pv-w') || 'fit'; }catch(e){}
applyWidth(w0);
render(fromHash() || 'home');
})();
