<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webkit.Studio v2 náhled</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400..700&display=swap">
<style>
/* Náhled D02 (simple). Lišta nahoře je mimo design webu. Rám je CSS container, takže 1440 / 390 přepíná skutečné breakpointy.
   Web v2 je jen světlý (bílá a modrá), tmavý režim není v rozsahu. */
:root{
  color-scheme: light;
  --c-white:#FFFFFF;
  --c-surface:#F5F6F9;
  --c-surface-2:#ECEEF4;
  --c-line:#E0E3EB;
  --c-line-strong:#C5CAD6;
  --c-ink:#0C0E1C;
  --c-ink-2:#464B5E;
  --c-ink-3:#5E6376;
  --c-blue:#1D2BE8;
  --c-blue-hover:#1520C4;
  --c-blue-press:#0F189A;
  --c-blue-50:#EFF3FF;
  --c-blue-100:#DCE4FF;
  --c-blue-on-dark:#86A2FF;
  --c-on-blue-2:rgba(255,255,255,.8);
  --c-on-ink-2:rgba(255,255,255,.7);
  --c-line-on-dark:rgba(255,255,255,.16);
  --c-error:#C0261B;
  --c-warn-bg:#FFF4D6;
  --c-warn-ink:#6B4A00;
  --f-display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r-sm:10px; --r-md:16px; --r-lg:24px; --r-pill:999px;
  --dur-1:150ms; --dur-2:300ms; --dur-3:500ms; --dur-4:800ms;
  --ease-out:cubic-bezier(.2,.7,.2,1);
  --ease-draw:cubic-bezier(.14,0,0,1.01);
  --tb-h:0px;
  --pv-bg:#E6E8EE;
}
*{box-sizing:border-box}
body{margin:0;background:var(--pv-bg);color:var(--c-ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}

/* ============ NÁHLED: lišta ============ */
.pv{position:sticky;top:env(safe-area-inset-top,0px);z-index:200;background:#fff;border-bottom:1px solid var(--c-line);color:var(--c-ink)}
.pv__row{display:flex;align-items:center;gap:12px;padding:8px 16px;flex-wrap:wrap}
.pv__brand{display:flex;align-items:center;gap:8px;font:600 14px/1 var(--f-body);white-space:nowrap}
.pv__brand small{font:500 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--c-ink-3)}
.pv__tabs{display:flex;gap:2px;background:var(--c-surface-2);padding:3px;border-radius:var(--r-pill);overflow-x:auto;max-width:100%;scrollbar-width:none}
.pv__tab{border:0;background:transparent;padding:0 14px;min-height:32px;border-radius:var(--r-pill);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--c-ink-2)}
.pv__tab:hover{color:var(--c-ink)}
.pv__tab[aria-selected="true"]{background:#fff;color:var(--c-ink);box-shadow:0 0 0 1px var(--c-line)}
.pv__tab--lib[aria-selected="true"]{background:var(--c-ink);color:#fff;box-shadow:none}
.pv__sep{flex:1}
.pv__seg{display:flex;gap:2px;background:var(--c-surface-2);padding:3px;border-radius:var(--r-pill)}
.pv__seg button{border:0;background:transparent;min-height:28px;padding:0 10px;border-radius:var(--r-pill);font:500 12px/1 var(--f-mono);cursor:pointer;color:var(--c-ink-2)}
.pv__seg button[aria-pressed="true"]{background:#fff;color:var(--c-ink);box-shadow:0 0 0 1px var(--c-line)}
.pv__chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--c-ink-2);cursor:pointer;min-height:28px;white-space:nowrap}
.pv__chk input{width:16px;height:16px;accent-color:var(--c-blue);margin:0}
.pv__order{display:flex;align-items:baseline;gap:8px;padding:0 16px 8px;font-size:12px;color:var(--c-ink-3);overflow-x:auto;white-space:nowrap}
.pv__order b{font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--c-ink-2)}
.pv__order ol{display:flex;gap:6px;margin:0;padding:0;list-style:none}
.pv__order li{display:flex;align-items:center;gap:6px}
.pv__order li+li::before{content:"→";color:var(--c-line-strong)}
.pv__order .sig{color:var(--c-blue);font-weight:600}
.pv button:focus-visible,.pv input:focus-visible{outline:2px solid var(--c-blue);outline-offset:2px}
@media (max-width:720px){.pv__order{display:none}.pv__brand small{display:none}}
.stage{padding:16px 16px 48px;display:flex;justify-content:center}
.stage--fit{padding:0}
.frame{--zoom:1;width:100%;background:#fff;container:site / inline-size;position:relative;zoom:var(--zoom);isolation:isolate}
.stage--w1440 .frame{width:1440px;flex:none;box-shadow:0 0 0 1px var(--c-line)}
.stage--w390 .frame{width:390px;flex:none;box-shadow:0 0 0 1px var(--c-line-strong);border-radius:28px;overflow:clip}

/* ============ WEB v2 ============ */
.site{font-family:var(--f-body);color:var(--c-ink);font-size:1rem;line-height:1.6;
  --gutter:clamp(16px,4.2cqi,56px);
  --sec-y:clamp(4.5rem,2.6rem + 7cqi,9.5rem);
  --t-h1:clamp(2.5rem,1rem + 4.6cqi,5.25rem);
  --t-h1-home:clamp(2.75rem,.8rem + 6cqi,6.5rem);
  --t-h2:clamp(2rem,1rem + 3cqi,3.75rem);
  --t-h3:clamp(1.25rem,1.05rem + .7cqi,1.75rem);
  --t-lead:clamp(1.125rem,1rem + .45cqi,1.375rem);
}
.site *:focus-visible{outline:2px solid var(--c-blue);outline-offset:3px;border-radius:4px}
.site :where(h1,h2,h3,h4){font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;color:var(--c-ink)}
.site :where(h1){font-size:var(--t-h1);line-height:1.02;letter-spacing:-.04em}
.site :where(h2){font-size:var(--t-h2);line-height:1.05;letter-spacing:-.035em}
.site :where(h3){font-size:var(--t-h3);line-height:1.2;letter-spacing:-.02em}
.site :where(p){margin:0;text-wrap:pretty}
.site :where(a){color:inherit}
.site :where(ul,ol){margin:0;padding:0;list-style:none}
.container{max-width:1312px;margin-inline:auto;padding-inline:var(--gutter)}
.sec{padding-block:var(--sec-y);position:relative}
.sec--surface{background:var(--c-surface)}
.sec--flush-top{padding-top:0}
.lead{font-size:var(--t-lead);line-height:1.5;color:var(--c-ink-2);max-width:44ch}
.muted{color:var(--c-ink-2)}
.hl{color:var(--c-blue)}
.fill{background:var(--c-warn-bg);color:var(--c-warn-ink);font:500 .78em/1.2 var(--f-mono);padding:.1em .35em;border-radius:4px;letter-spacing:0;border:1px dashed #D9B350;box-decoration-break:clone;-webkit-box-decoration-break:clone}
h1 .fill,h2 .fill,h3 .fill,blockquote .fill,.stat .fill,.work__n .fill{font-size:.36em;vertical-align:middle;line-height:1.6}
.label{font:500 .75rem/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--c-ink-3)}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Tlačítko */
.btn{--bg:var(--c-blue);--fg:#fff;--disc:#fff;--disc-fg:var(--c-blue);--bd:transparent;
  display:inline-flex;align-items:center;gap:12px;min-height:52px;padding:6px 6px 6px 24px;border-radius:var(--r-pill);
  background:var(--bg);color:var(--fg);border:1px solid var(--bd);text-decoration:none;font:600 1rem/1 var(--f-body);
  cursor:pointer;transition:background-color var(--dur-2) var(--ease-out),border-color var(--dur-2),color var(--dur-2),transform var(--dur-1);white-space:nowrap}
.btn__label{display:block;overflow:hidden;height:1.25em;line-height:1.25em}
.btn__label>span{display:block;position:relative;transition:transform var(--dur-2) var(--ease-out)}
.btn__label>span::after{content:attr(data-t);content:attr(data-t) / "";position:absolute;left:0;top:100%;white-space:nowrap}
.btn__disc{width:40px;height:40px;border-radius:50%;background:var(--disc);color:var(--disc-fg);display:grid;place-items:center;overflow:hidden;flex:none}
.btn__disc svg{width:16px;height:16px;transition:transform var(--dur-2) var(--ease-out);grid-area:1/1}
.btn__disc svg+svg{transform:translateX(-160%)}
.btn:hover .btn__label>span,.btn.is-hover .btn__label>span{transform:translateY(-100%)}
.btn:hover .btn__disc svg:first-child,.btn.is-hover .btn__disc svg:first-child{transform:translateX(160%)}
.btn:hover .btn__disc svg+svg,.btn.is-hover .btn__disc svg+svg{transform:none}
.btn:hover,.btn.is-hover{--bg:var(--c-blue-hover)}
.btn:active{transform:scale(.98);--bg:var(--c-blue-press)}
.btn--secondary{--bg:transparent;--fg:var(--c-ink);--bd:var(--c-line-strong);--disc:var(--c-ink);--disc-fg:#fff}
.btn--secondary:hover,.btn--secondary.is-hover{--bg:var(--c-ink);--fg:#fff;--bd:var(--c-ink);--disc:#fff;--disc-fg:var(--c-ink)}
.btn--white{--bg:#fff;--fg:var(--c-blue);--disc:var(--c-blue);--disc-fg:#fff}
.btn--white:hover,.btn--white.is-hover{--bg:var(--c-blue-50)}
.btn--sm{min-height:44px;padding:4px 4px 4px 18px;font-size:.9375rem;gap:10px}
.btn--sm .btn__disc{width:34px;height:34px}
.btn.is-loading .btn__disc svg{display:none}
.btn.is-loading .btn__disc::after{content:"";width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-row{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}

/* Odkaz */
.link{color:var(--c-ink);text-decoration:none;font-weight:500;background:linear-gradient(currentColor,currentColor) no-repeat right bottom/0 1px;padding-bottom:2px;transition:background-size var(--dur-3) var(--ease-draw)}
.link:hover,.link.is-hover{background-size:100% 1px;background-position-x:left}
.link--static{background-size:100% 1px}
.link--static:hover{background-size:0 1px;background-position-x:right}
.link--arrow{display:inline-flex;align-items:center;gap:8px;min-height:44px}
.link--arrow svg{width:14px;height:14px;transition:transform var(--dur-2) var(--ease-out)}
.link--arrow:hover svg{transform:translateX(3px)}

/* Štítek (jen u projektů) */
.tag{display:inline-flex;align-items:center;min-height:28px;padding:0 12px;border-radius:var(--r-pill);font:500 .8125rem/1 var(--f-body);background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28);white-space:nowrap}
.tag--light{background:var(--c-surface);color:var(--c-ink-2);border-color:transparent}
.tags{display:flex;flex-wrap:wrap;gap:6px}

/* Hlavička sekce: jen nadpis a krátký perex, bez štítku */
.sh{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px clamp(2rem,5cqi,6rem);align-items:end;margin-bottom:clamp(2.5rem,1.5rem + 3.5cqi,5rem)}
.sh--solo{grid-template-columns:minmax(0,1fr);max-width:900px}
.sh__side{display:grid;gap:20px;justify-items:start}
@container site (max-width:860px){.sh{grid-template-columns:1fr}}

/* Grafický doplněk: dlaždice ze symbolu loga (čtvrtkruhy) */
.tiles{--n:3;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:0;aspect-ratio:1;width:100%;max-width:520px}
.tile{position:relative;aspect-ratio:1;transition:transform var(--dur-4) var(--ease-out);transform:rotate(calc(var(--r,0) * 90deg))}
.tile svg{width:100%;height:100%;display:block}
.tile--blue{color:var(--c-blue)} .tile--ink{color:var(--c-ink)} .tile--soft{color:var(--c-blue-100)} .tile--line{color:var(--c-surface-2)}
.tiles--sm{max-width:300px}

/* ---------- Navbar ---------- */
.nav{position:sticky;top:var(--tb-h);z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:transform var(--dur-3) var(--ease-out),border-color var(--dur-2)}
.nav.is-scrolled{border-bottom-color:var(--c-line)}
.nav.is-hidden{transform:translateY(-100%)}
.nav.is-open{transform:none}
.nav__in{display:flex;align-items:center;gap:32px;height:76px}
.logo{display:inline-flex;align-items:center;gap:.42em;text-decoration:none;color:var(--c-ink);font:600 1.3rem/1 var(--f-body);letter-spacing:-.035em;min-height:44px;white-space:nowrap}
.logo svg{width:1.15em;height:1.15em;flex:none}
.nav__links{display:flex;align-items:center;gap:4px;margin-left:auto}
.nav__link{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:var(--r-pill);border:0;background:none;text-decoration:none;font:500 .9375rem/1 var(--f-body);color:var(--c-ink);cursor:pointer}
.nav__link:hover,.nav__link[aria-expanded="true"]{background:var(--c-surface)}
.nav__link svg{width:14px;height:14px;transition:transform var(--dur-2)}
.nav__link[aria-expanded="true"] svg{transform:rotate(180deg)}
.nav__burger{display:none;margin-left:auto;width:48px;height:48px;border-radius:50%;border:1px solid var(--c-line-strong);background:#fff;cursor:pointer;place-items:center}
.nav__burger span{display:block;width:18px;height:1.5px;background:var(--c-ink);position:relative}
.nav__burger span::before,.nav__burger span::after{content:"";position:absolute;left:0;width:18px;height:1.5px;background:var(--c-ink);transition:transform var(--dur-2)}
.nav__burger span::before{top:-6px}.nav__burger span::after{top:6px}
.nav.is-open .nav__burger span{background:transparent}
.nav.is-open .nav__burger span::before{transform:translateY(6px) rotate(45deg)}
.nav.is-open .nav__burger span::after{transform:translateY(-6px) rotate(-45deg)}
.menu{position:absolute;left:0;right:0;top:100%;background:#fff;border-bottom:1px solid var(--c-line);opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity var(--dur-2),transform var(--dur-2) var(--ease-out),visibility 0s linear var(--dur-2)}
.menu.is-open{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.menu__in{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) minmax(0,.8fr);gap:8px 48px;padding-block:32px 40px}
.menu a{display:flex;align-items:center;min-height:52px;border-bottom:1px solid var(--c-line);text-decoration:none;font:600 1.125rem/1.2 var(--f-display);letter-spacing:-.01em}
.menu a:hover{color:var(--c-blue)}
.menu a[aria-current="page"]{color:var(--c-blue)}
.menu__side{display:grid;align-content:start;gap:14px;padding-left:32px;border-left:1px solid var(--c-line)}
.menu__side p{color:var(--c-ink-2);font-size:.9375rem}
.menu__side a{border:0;min-height:auto;font:500 1rem/1.3 var(--f-body)}
.menu__extra{display:none}
@container site (max-width:991px){
  .nav__links,.nav__cta{display:none}
  .nav__burger{display:grid}
  .nav__in{height:68px}
  .menu{max-height:calc(100vh - 68px - var(--tb-h));overflow:auto}
  .menu__in{grid-template-columns:1fr;gap:0;padding-block:12px 28px}
  .menu__side{padding:20px 0 0;border:0}
  .menu__extra{display:block}
}

/* ---------- Hero ---------- */
.hero{padding-block:clamp(3.5rem,2rem + 6cqi,8rem) clamp(4rem,2rem + 6cqi,8rem)}
.hero__grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);gap:clamp(2rem,6cqi,6rem);align-items:center}
.hero__text{display:grid;gap:32px;justify-items:start;min-width:0}
.hero--home h1{font-size:var(--t-h1-home);line-height:.98;letter-spacing:-.05em;max-width:12ch}
.hero__proof{display:grid;gap:10px}
.hero__proof li{display:flex;gap:12px;align-items:flex-start;color:var(--c-ink-2)}
.hero__proof svg{width:20px;height:20px;flex:none;color:var(--c-blue);margin-top:3px}
.hero__art{justify-self:end;width:100%;display:grid;justify-items:end}
.svc-strip{margin-top:clamp(3rem,2rem + 4cqi,6rem);padding-top:24px;border-top:1px solid var(--c-line);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.svc-strip{gap:4px 28px!important}
.svc-strip a{display:inline-flex;align-items:center;min-height:44px;text-decoration:none;font:500 1rem/1 var(--f-body);color:var(--c-ink-2);white-space:nowrap;background:linear-gradient(currentColor,currentColor) no-repeat right calc(50% + .75em)/0 1px;transition:color var(--dur-2),background-size var(--dur-3) var(--ease-draw)}
.svc-strip a:hover{color:var(--c-blue);background-size:100% 1px;background-position-x:left}
@container site (max-width:860px){.hero__grid{grid-template-columns:1fr}.hero__art{justify-self:start;justify-items:start}.hero__art .tiles{max-width:132px}}

/* ---------- Statement ---------- */
.statement{font:500 clamp(1.75rem,1rem + 2.6cqi,3.5rem)/1.14 var(--f-display);letter-spacing:-.03em;max-width:22ch;text-wrap:balance}
.statement .dim{color:#767B8E}
.values{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px clamp(1.5rem,4cqi,4rem);margin-top:clamp(3rem,2rem + 3cqi,5rem)}
.value h3{font-size:1.25rem;margin-bottom:8px}
.value p{color:var(--c-ink-2)}
.statement-foot{margin-top:clamp(2.5rem,2rem + 2cqi,4rem)}
@container site (max-width:767px){.values{grid-template-columns:1fr}}

/* ---------- Služby: 2 sloupce po 4 ---------- */
.svc2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:clamp(2rem,6cqi,6rem)}
.svc2__col{border-top:1px solid var(--c-line)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:6px 20px;align-items:center;padding:26px 0;border-bottom:1px solid var(--c-line);text-decoration:none;color:inherit}
.srow h3{font-size:clamp(1.375rem,1.1rem + .9cqi,2rem);transition:color var(--dur-2)}
.srow p{grid-column:1;color:var(--c-ink-2);font-size:.9375rem}
.srow__arrow{grid-row:1 / span 2;grid-column:2;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--c-line-strong);transition:all var(--dur-2) var(--ease-out)}
.srow__arrow svg{width:16px;height:16px}
.srow:hover h3{color:var(--c-blue)}
.srow:hover .srow__arrow{background:var(--c-blue);border-color:var(--c-blue);color:#fff}
.svc-agency{margin-top:28px;color:var(--c-ink-2)}
@container site (max-width:767px){.svc2{grid-template-columns:1fr}.svc2__col+.svc2__col{border-top:0}}

/* ---------- Naše práce (portfolio-17) ---------- */
.works{display:grid;gap:clamp(1rem,.5rem + 1.5cqi,2rem)}
.work{position:relative;display:block;border-radius:var(--r-lg);overflow:hidden;text-decoration:none;color:#fff;aspect-ratio:16/8;background:#0C0E1C;isolation:isolate}
.work__media{position:absolute;inset:0;z-index:-1}
.work__media img{width:100%;height:100%;object-fit:cover;animation:pan 22s ease-in-out infinite alternate;transform-origin:70% 50%}
.work:nth-child(2) .work__media img{animation-duration:26s;transform-origin:30% 60%}
.work:nth-child(3) .work__media img{animation-duration:24s}
@keyframes pan{from{transform:scale(1.02) translateX(0)}to{transform:scale(1.12) translateX(-2.5%)}}
.work::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,9,20,.92) 0%,rgba(8,9,20,.8) 36%,rgba(8,9,20,.35) 62%,rgba(8,9,20,0) 82%);z-index:-1}
.work__body{position:absolute;inset:0;padding:clamp(1.5rem,1rem + 2.5cqi,3.5rem);display:flex;flex-direction:column;justify-content:space-between;gap:24px;max-width:640px}
.work__client{font-size:.9375rem;color:rgba(255,255,255,.78)}
.work__title{font:600 clamp(1.5rem,1rem + 1.8cqi,2.75rem)/1.08 var(--f-display);letter-spacing:-.03em;color:#fff;text-wrap:balance}
.work__n{font:600 clamp(2.5rem,1.5rem + 3.5cqi,5rem)/1 var(--f-display);letter-spacing:-.05em}
.work__n small{display:block;font:400 .9375rem/1.4 var(--f-body);letter-spacing:0;color:rgba(255,255,255,.78);margin-top:6px}
.work__foot{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.work__go{position:absolute;right:clamp(1.5rem,1rem + 2.5cqi,3.5rem);bottom:clamp(1.5rem,1rem + 2.5cqi,3.5rem);width:56px;height:56px;border-radius:50%;background:#fff;color:var(--c-ink);display:grid;place-items:center;transition:transform var(--dur-2) var(--ease-out),background-color var(--dur-2)}
.work__go svg{width:20px;height:20px}
.work:hover .work__go{transform:rotate(-45deg);background:var(--c-blue);color:#fff}
.works-foot{margin-top:32px}
@container site (max-width:767px){
  .work{aspect-ratio:auto;display:flex;flex-direction:column;background:var(--c-ink)}
  .work::before{display:none}
  .work__body{position:static;padding:24px 24px 20px;gap:18px}
  .work__media{position:relative;inset:auto;z-index:0;aspect-ratio:16/10;overflow:hidden}
  .work__go{top:20px;right:20px;bottom:auto;width:48px;height:48px}
  .work__title{padding-right:56px}
}

/* ---------- Proč s námi ---------- */
.reasons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(2rem,1.5rem + 2cqi,3.5rem) clamp(1.5rem,4cqi,4rem)}
.reason{display:grid;gap:10px;align-content:start;padding-top:22px;border-top:1px solid var(--c-line)}
.reason__n{font:500 .8125rem/1 var(--f-mono);color:var(--c-blue)}
.reason h3{font-size:clamp(1.125rem,1rem + .45cqi,1.375rem)}
.reason p{color:var(--c-ink-2);font-size:.9375rem}
@container site (max-width:991px){.reasons{grid-template-columns:1fr 1fr}}
@container site (max-width:600px){.reasons{grid-template-columns:1fr}}

/* ---------- Reference ---------- */
.refs{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(2rem,6cqi,6rem);align-items:start}
.refs blockquote{margin:0;font:500 clamp(1.5rem,1rem + 1.9cqi,2.75rem)/1.2 var(--f-display);letter-spacing:-.025em;text-wrap:balance}
.refs blockquote::before{content:"„";display:block;font-size:2em;line-height:.6;color:var(--c-blue);margin-bottom:.1em}
.refs__who{margin-top:24px;color:var(--c-ink-2)}
.refs__who strong{color:var(--c-ink)}
.partner{display:grid;gap:14px;align-content:start;padding-top:22px;border-top:1px solid var(--c-line)}
.partner__mark{width:56px;height:56px;border-radius:14px;background:var(--c-ink);color:#fff;display:grid;place-items:center;font:700 1.125rem/1 var(--f-display);letter-spacing:-.04em}
.partner h3{font-size:1.375rem}
.partner p{color:var(--c-ink-2)}
@container site (max-width:860px){.refs{grid-template-columns:1fr}}

/* ---------- Postup ---------- */
.steps{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:clamp(2rem,1.5rem + 2cqi,3.5rem) clamp(1.5rem,4cqi,4rem)}
.step{display:grid;gap:10px;align-content:start;padding-top:22px;border-top:1px solid var(--c-line);position:relative}
.step::before{content:"";position:absolute;left:0;top:-1px;height:1px;width:48px;background:var(--c-blue)}
.step__top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.step__n{font:500 .8125rem/1 var(--f-mono);color:var(--c-ink-3)}
.step__free{font:600 .8125rem/1 var(--f-body);color:var(--c-blue)}
.step h3{font-size:clamp(1.125rem,1rem + .45cqi,1.375rem)}
.step p{color:var(--c-ink-2);font-size:.9375rem}
.steps-foot{margin-top:clamp(2.5rem,2rem + 2cqi,4rem)}
@container site (max-width:991px){.steps{grid-template-columns:1fr 1fr}}
@container site (max-width:600px){.steps{grid-template-columns:1fr}}

/* ---------- Problémy ---------- */
.probs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(2rem,1.5rem + 2cqi,3.5rem) clamp(1.5rem,4cqi,4rem)}
.prob{display:grid;gap:12px;align-content:start;padding-top:22px;border-top:1px solid var(--c-ink)}
.prob h3{font-size:clamp(1.25rem,1.05rem + .7cqi,1.625rem)}
.prob p{color:var(--c-ink-2)}
.prob__fix{color:var(--c-ink)!important;font-weight:600}
.prob__fix::before{content:"→ ";color:var(--c-blue)}
.probs-foot{margin-top:clamp(2.5rem,2rem + 2cqi,4rem)}
@container site (max-width:860px){.probs{grid-template-columns:1fr}}

/* ---------- Co dostanete (seznam) ---------- */
.gets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:clamp(2rem,6cqi,6rem);border-top:1px solid var(--c-line)}
.get{display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 16px;padding:28px 0;border-bottom:1px solid var(--c-line);align-content:start}
.get__n{font:600 1.75rem/1 var(--f-display);color:var(--c-blue);letter-spacing:-.04em;grid-row:span 2}
.get h3{font-size:clamp(1.125rem,1rem + .5cqi,1.5rem)}
.get p{color:var(--c-ink-2);font-size:.9375rem}
.get__need{grid-column:2;justify-self:start;margin-top:10px;min-height:44px;padding:0;border:0;background:none;font:600 .9375rem/1 var(--f-body);color:var(--c-blue);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.get__need svg{width:14px;height:14px;transition:transform var(--dur-2)}
.get__need:hover svg{transform:translateX(3px)}
@container site (max-width:767px){.gets{grid-template-columns:1fr}}

/* ---------- Čísla ---------- */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.stat{display:grid;gap:8px}
.stat__n{font:600 clamp(3rem,1.5rem + 5cqi,6rem)/1 var(--f-display);letter-spacing:-.05em}
.stat p{color:var(--c-ink-2);max-width:26ch}
@container site (max-width:767px){.stats{grid-template-columns:1fr}}

/* ---------- Podpis: srovnání ---------- */
.cmp{overflow:auto}
.cmp table{width:100%;border-collapse:collapse;min-width:640px}
.cmp th,.cmp td{padding:18px 20px 18px 0;text-align:left;vertical-align:top;border-bottom:1px solid var(--c-line);font-size:.9375rem;line-height:1.45}
.cmp thead th{font:600 1.125rem/1.2 var(--f-display);border-bottom:1px solid var(--c-ink)}
.cmp thead th.is-us{color:var(--c-blue)}
.cmp tbody th{font-weight:600;width:26%}
.cmp td{color:var(--c-ink-2)}
.cmp td.is-us{color:var(--c-ink);font-weight:500}
.cmp-note{margin-top:16px;font-size:.875rem;color:var(--c-ink-3)}

/* ---------- Podpis: před a po (ilustrace) ---------- */
.ba{position:relative;border-radius:var(--r-lg);overflow:hidden;background:var(--c-surface);aspect-ratio:16/8;--pos:50%;user-select:none;touch-action:pan-y}
.ba__layer{position:absolute;inset:0}
.ba__before{clip-path:inset(0 calc(100% - var(--pos)) 0 0)}
.ba__line{position:absolute;top:0;bottom:0;left:var(--pos);width:2px;margin-left:-1px;background:var(--c-blue);pointer-events:none}
.ba__handle{position:absolute;top:50%;left:var(--pos);width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:var(--c-blue);color:#fff;display:grid;place-items:center;pointer-events:none}
.ba__handle svg{width:22px;height:22px}
.ba__range{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.ba__range:focus-visible~.ba__handle{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--c-blue)}
.ba__tag{position:absolute;top:16px;z-index:2;font:600 .8125rem/1 var(--f-body);padding:8px 12px;border-radius:var(--r-pill);background:#fff;color:var(--c-ink)}
.ba__tag--l{left:16px;background:var(--c-ink);color:#fff}.ba__tag--r{right:16px}
.mk{position:absolute;inset:0;padding:5% 6%;display:flex;flex-direction:column;gap:7%}
.mk__nav{display:flex;gap:3%;align-items:center;font-size:clamp(8px,1.05cqi,13px)}
.mk__nav b{margin-right:auto;font-size:1.15em}
.mk__grid{display:grid;grid-template-columns:1.3fr 1fr;gap:6%;align-items:start}
.mk__col{display:flex;flex-direction:column;gap:clamp(8px,1.5cqi,20px);align-items:flex-start}
.mk__card{border-radius:12px;padding:7%;display:grid;gap:clamp(6px,.9cqi,12px);font-size:clamp(9px,1.05cqi,14px);font-weight:600}
.mk__card i{display:block;height:clamp(10px,2.2cqi,28px);border-radius:6px;border:1px solid var(--c-line-strong);background:#fff}
.mk--before .mk__card{background:#DCDCDC;color:#4A4A4A;border-radius:2px;grid-template-columns:1fr 1fr}
.mk--before .mk__card b,.mk--before .mk__card .mk__b{grid-column:1/-1;justify-self:start}
.mk--before .mk__card i{border-radius:2px;border-color:#C8C8C8}
.mk--after .mk__card{background:var(--c-surface);color:var(--c-ink)}
.mk--after .mk__card .mk__b{text-align:center}
.mk__card small{font-weight:400;color:var(--c-ink-3);font-size:.85em}
.mk__h{font:700 clamp(13px,2.2cqi,30px)/1.1 var(--f-display)}
.mk__p{font-size:clamp(9px,1.05cqi,14px);line-height:1.5}
.mk__btns{display:flex;gap:2%;flex-wrap:wrap}
.mk__b{font-size:clamp(8px,1cqi,13px);padding:.55em 1em;border-radius:4px;color:#fff;white-space:nowrap}
.mk--before{background:#EFEFEF;color:#6A6A6A}
.mk--before .mk__h{color:#6A6A6A;text-transform:uppercase;font-size:clamp(11px,1.7cqi,24px);overflow-wrap:anywhere}
.mk--before .mk__b{background:#6B6B6B}
.mk--before .mk__b:nth-child(2){background:#A35A00}.mk--before .mk__b:nth-child(3){background:#3B7428}
.mk--after{background:#fff;color:var(--c-ink-2)}
.mk--after .mk__h{color:var(--c-ink);font-weight:600;letter-spacing:-.03em;max-width:70%}
.mk--after .mk__h span{color:var(--c-blue)}
.mk--after .mk__b{background:var(--c-blue);border-radius:999px;padding:.6em 1.2em}
.ba-legend{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.5rem,4cqi,4rem);margin-top:28px}
.ba-legend li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--c-line);color:var(--c-ink-2);font-size:.9375rem}
.ba-legend li b{font:500 .8125rem/1.7 var(--f-mono);color:var(--c-ink)}
@container site (max-width:767px){.mk__grid{grid-template-columns:1fr;gap:6%}.mk__nav span{display:none}.ba{aspect-ratio:3/4}.ba-legend{grid-template-columns:1fr}.mk__p{max-width:100%}.mk--after .mk__h{max-width:100%}}

/* ---------- Podpis: pro koho to je ---------- */
.fit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(2rem,1.5rem + 2cqi,3.5rem) clamp(1.5rem,4cqi,4rem)}
.persona{display:grid;gap:12px;align-content:start;padding-top:22px;border-top:1px solid var(--c-ink)}
.persona h3{font-size:clamp(1.25rem,1.05rem + .7cqi,1.625rem)}
.persona p{color:var(--c-ink-2)}
.notfit{margin-top:clamp(3rem,2rem + 3cqi,5rem);display:grid;grid-template-columns:minmax(0,.6fr) minmax(0,1fr);gap:20px clamp(2rem,6cqi,6rem);padding:clamp(1.5rem,1rem + 2cqi,2.5rem);border-radius:var(--r-lg);background:var(--c-surface)}
.notfit h3{font-size:clamp(1.25rem,1.05rem + .7cqi,1.625rem)}
.notfit ul{display:grid;gap:10px}
.notfit li{display:flex;gap:10px;color:var(--c-ink-2)}
.notfit li::before{content:"×";color:var(--c-ink-3);font-weight:600}
@container site (max-width:860px){.fit,.notfit{grid-template-columns:1fr}}

/* ---------- FAQ ---------- */
.faq-wrap{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(2rem,6cqi,6rem);align-items:start}
.faq-wrap .sh{margin:0;grid-template-columns:1fr;position:sticky;top:calc(var(--tb-h) + 110px)}
.faq{border-top:1px solid var(--c-line);interpolate-size:allow-keywords}
.faq details{border-bottom:1px solid var(--c-line)}
.faq summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:20px;align-items:center;padding:22px 0;cursor:pointer;font:600 clamp(1.0625rem,1rem + .35cqi,1.25rem)/1.35 var(--f-display);min-height:44px}
.faq summary::-webkit-details-marker{display:none}
.faq summary:hover{color:var(--c-blue)}
.plus{width:44px;height:44px;border-radius:50%;border:1px solid var(--c-line-strong);position:relative;transition:background-color var(--dur-2),border-color var(--dur-2)}
.plus::before,.plus::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:1.5px;background:currentColor;transform:translate(-50%,-50%);transition:transform var(--dur-2)}
.plus::after{transform:translate(-50%,-50%) rotate(90deg)}
.faq details[open] .plus{background:var(--c-ink);border-color:var(--c-ink);color:#fff}
.faq details[open] .plus::after{transform:translate(-50%,-50%) rotate(0)}
.faq__a{padding:0 64px 24px 0;color:var(--c-ink-2)}
.faq details::details-content{block-size:0;overflow:clip;transition:block-size var(--dur-3) var(--ease-out),content-visibility var(--dur-3) allow-discrete}
.faq details[open]::details-content{block-size:auto}
@container site (max-width:860px){.faq-wrap{grid-template-columns:1fr}.faq-wrap .sh{position:static}.faq__a{padding-right:0}}

/* ---------- CTA malé ---------- */
.cta-line{display:flex;justify-content:space-between;align-items:center;gap:24px 40px;flex-wrap:wrap;padding-block:clamp(2rem,1.5rem + 2cqi,3rem);border-top:1px solid var(--c-line);border-bottom:1px solid var(--c-line)}
.cta-line h3{font-size:clamp(1.5rem,1.1rem + 1.4cqi,2.5rem);max-width:22ch}

/* ---------- CTA velké s formulářem ---------- */
.cta-big{background:var(--c-blue);color:#fff}
.cta-big__grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,540px);gap:clamp(2.5rem,6cqi,6rem);align-items:start}
.cta-big__left{display:grid;gap:28px;align-content:start;height:100%}
.cta-big h2{color:#fff;font-size:clamp(2.5rem,1rem + 4.6cqi,5.25rem);line-height:1;letter-spacing:-.045em;max-width:12ch}
.cta-big .lead{color:var(--c-on-blue-2)}
.who{display:flex;gap:14px;align-items:center;margin-top:auto;padding-top:24px}
.who img{width:56px;height:56px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,.2)}
.who__t{font-size:.875rem;line-height:1.45;color:var(--c-on-blue-2)}
.who__t a{color:#fff;display:inline-block;min-height:24px;line-height:24px}
.form{background:#fff;color:var(--c-ink);border-radius:var(--r-lg);padding:clamp(1.5rem,1rem + 2cqi,2.5rem);display:grid;gap:20px}
.form__fields{display:grid;gap:18px}
.form__row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:grid;gap:8px;min-width:0}
.field label{font-weight:600;font-size:.9375rem}
.input{width:100%;min-height:52px;padding:14px 16px;border-radius:var(--r-sm);border:1px solid var(--c-line-strong);background:#fff;font:400 1rem/1.4 var(--f-body);color:var(--c-ink);transition:border-color var(--dur-1),box-shadow var(--dur-1)}
.input:hover{border-color:var(--c-ink-3)}
.input:focus{outline:none;border-color:var(--c-blue);box-shadow:0 0 0 1px var(--c-blue),0 0 0 5px var(--c-blue-100)}
textarea.input{min-height:128px;resize:vertical;position:relative;z-index:1;background:transparent}
.ta{position:relative;background:#fff;border-radius:var(--r-sm)}
.ta__ghost{position:absolute;inset:0;padding:15px 17px;color:#6F7488;font:400 1rem/1.4 var(--f-body);pointer-events:none;white-space:pre-wrap;overflow:hidden}
.ta__pre{color:#8A8FA0}
.ta__ghost::after{content:"";display:inline-block;width:1px;height:1.1em;background:currentColor;vertical-align:-.15em;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ta.is-typing .ta__ghost{display:none}
.field.is-error .input{border-color:var(--c-error)}
.field__msg{font-size:.875rem;color:var(--c-error)}
.field__msg:empty{display:none}
.form__send{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.form__promise{font-weight:600;font-size:.9375rem}
.form__note{font-size:.8125rem;color:var(--c-ink-3)}
.form__ok{display:none;gap:16px}
.form.is-sent .form__fields{display:none}
.form.is-sent .form__ok{display:grid}
.form__ok h3{font-size:1.5rem}
.cal{border:1px solid var(--c-line);border-radius:var(--r-md);padding:18px;display:grid;gap:14px}
.cal__head{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.cal__days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cal__day{min-height:56px;border-radius:var(--r-sm);border:1px solid var(--c-line);background:#fff;display:grid;place-items:center;font:500 .8125rem/1.3 var(--f-body);cursor:pointer;text-align:center}
.cal__day b{display:block;font:600 1rem/1 var(--f-display)}
.cal__day[aria-pressed="true"]{background:var(--c-blue);border-color:var(--c-blue);color:#fff}
.cal__slots{display:flex;flex-wrap:wrap;gap:6px}
.cal__slot{min-height:44px;padding:0 16px;border-radius:var(--r-pill);border:1px solid var(--c-line-strong);background:#fff;font:500 .9375rem/1 var(--f-body);cursor:pointer}
.cal__slot:hover{border-color:var(--c-blue);color:var(--c-blue)}
@container site (max-width:991px){.cta-big__grid{grid-template-columns:1fr}.who{margin-top:0}}
@container site (max-width:560px){.form__row{grid-template-columns:1fr}.cal__days{grid-template-columns:repeat(3,1fr)}.cal__day:nth-child(n+4){display:none}}

/* ---------- Footer ---------- */
.foot{background:var(--c-ink);color:#fff;padding-block:clamp(4rem,2.5rem + 4cqi,6.5rem) 28px;overflow:hidden}
.foot a{color:#fff;text-decoration:none}
.foot__top{display:grid;grid-template-columns:minmax(0,1.2fr) repeat(3,minmax(0,1fr));gap:40px}
.foot__brand{display:grid;gap:16px;align-content:start;max-width:30ch}
.foot__brand p{color:var(--c-on-ink-2)}
.foot h3{font:500 .75rem/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--c-on-ink-2);margin-bottom:14px}
.foot__col a{display:flex;align-items:center;min-height:36px;color:rgba(255,255,255,.92)}
.foot__col a:hover{color:#fff;text-decoration:underline}
.foot__logo{margin-top:clamp(3.5rem,2rem + 5cqi,7rem);color:#fff}
.foot__logo .logo{color:#fff;font-size:clamp(2.75rem,.5rem + 10.4cqi,11.25rem);letter-spacing:-.045em;gap:.3em;min-height:0;width:100%}
.foot__logo .logo svg{width:.92em;height:.92em}
.foot__bottom{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between;align-items:center;padding-top:24px;margin-top:clamp(2rem,1rem + 2cqi,3rem);border-top:1px solid var(--c-line-on-dark);color:var(--c-on-ink-2);font-size:.875rem}
.foot__bottom nav{display:flex;flex-wrap:wrap;gap:4px 24px}
.foot__bottom a,.foot__bottom button{color:var(--c-on-ink-2);min-height:32px;display:inline-flex;align-items:center;background:none;border:0;padding:0;cursor:pointer;font-size:.875rem}
.foot__bottom a:hover,.foot__bottom button:hover{color:#fff}
.foot *:focus-visible{outline-color:#fff}
@container site (max-width:991px){.foot__top{grid-template-columns:1fr 1fr}.foot__brand{grid-column:1/-1}}
@container site (max-width:480px){.foot__top{grid-template-columns:1fr}}

/* ---------- Pohyb ---------- */
.js-motion [data-reveal].is-pre{opacity:0;transform:translateY(24px)}
.js-motion [data-reveal]{transition:opacity .5s var(--ease-out),transform .7s var(--ease-out)}
.w{display:inline-block;transition:transform .8s var(--ease-out),opacity .6s var(--ease-out)}
.lines-pre .w{transform:translateY(.45em);opacity:0}
.lines-pre.lines-soft .w{opacity:1;transform:translateY(.25em)}

/* ---------- Názvy komponent (náhled) ---------- */
.show-labels [data-comp]{outline:1px dashed rgba(29,43,232,.55);outline-offset:-1px}
.show-labels [data-comp]::after{content:attr(data-label);position:absolute;top:8px;left:8px;z-index:40;font:500 11px/1 var(--f-mono);background:var(--c-blue);color:#fff;padding:6px 8px;border-radius:6px;pointer-events:none}
.show-labels [data-comp][data-sig]::after{background:var(--c-ink)}
.show-labels .nav[data-comp]::after{top:auto;bottom:-26px}
.show-labels .foot[data-comp]{position:relative}

/* ============ KNIHOVNA ============ */
.lib{padding-block:clamp(3rem,2rem + 4cqi,6rem)}
.lib__intro{display:grid;gap:16px;max-width:760px;margin-bottom:clamp(3rem,2rem + 3cqi,5rem)}
.lib__intro h1{font-size:clamp(2.25rem,1rem + 3.4cqi,4rem)}
.lib-sec{padding-block:clamp(2.5rem,1.5rem + 3cqi,4rem);border-top:1px solid var(--c-line)}
.lib-sec>h2{font-size:clamp(1.75rem,1rem + 2cqi,2.5rem);margin-bottom:10px}
.lib-sec>.lead{margin-bottom:28px;max-width:70ch;font-size:1.0625rem}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sw{border:1px solid var(--c-line);border-radius:var(--r-sm);overflow:hidden}
.sw__c{height:72px}
.sw__m{padding:10px 12px;display:grid;gap:2px;font:400 .75rem/1.3 var(--f-mono);color:var(--c-ink-3)}
.sw__m strong{font-weight:500;color:var(--c-ink)}
.tscale{border-top:1px solid var(--c-line)}
.tscale__row{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;padding:18px 0;border-bottom:1px solid var(--c-line);align-items:baseline}
.tscale__row code{font:400 .75rem/1.5 var(--f-mono);color:var(--c-ink-3);display:block}
.states{display:flex;flex-wrap:wrap;gap:20px 16px;align-items:center}
.state{display:grid;gap:10px;justify-items:start}
.state--blue{background:var(--c-blue);padding:16px;border-radius:var(--r-sm)}
.state--blue .label{color:var(--c-on-blue-2)}
.twrap{overflow-x:auto;border:1px solid var(--c-line);border-radius:var(--r-sm)}
.ttable{width:100%;border-collapse:collapse;font-size:.875rem;min-width:720px}
.ttable th,.ttable td{text-align:left;padding:12px;border-bottom:1px solid var(--c-line);vertical-align:top}
.ttable thead th{font:500 .6875rem/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--c-ink-3);background:var(--c-surface)}
.ttable tbody th{font-weight:600}
.ttable td{color:var(--c-ink-2)}
.ttable tr:last-child>*{border-bottom:0}
.gone{display:flex;flex-wrap:wrap;gap:8px}
.gone span{padding:6px 12px;border-radius:var(--r-pill);background:var(--c-surface);color:var(--c-ink-3);text-decoration:line-through;font-size:.875rem}
@container site (max-width:767px){.tscale__row{grid-template-columns:1fr;gap:6px}}

@media (prefers-reduced-motion: reduce){
  .site *,.site *::before,.site *::after{transition-duration:1ms!important;animation:none!important}
}
.rm-force .site *,.rm-force .site *::before,.rm-force .site *::after{transition-duration:1ms!important;animation:none!important}
</style>

<div class="pv" id="pv" role="region" aria-label="Ovládání náhledu">
  <div class="pv__row">
    <div class="pv__brand"><svg viewBox="0 0 200 200" width="18" height="18" aria-hidden="true"><path fill="#1D2BE8" d="M0 0H100V100A100 100 0 0 1 0 0ZM100 0H200V100A100 100 0 0 1 100 0ZM0 100H100V200H0ZM100 100H200V200A100 100 0 0 1 100 100Z"/></svg>Webkit.Studio v2 <small>náhled D02</small></div>
    <div class="pv__tabs" role="tablist" aria-label="Stránka náhledu">
      <button class="pv__tab" role="tab" data-page="home">Homepage</button>
      <button class="pv__tab" role="tab" data-page="webflow">Webflow vývoj</button>
      <button class="pv__tab" role="tab" data-page="audit">UX audit</button>
      <button class="pv__tab" role="tab" data-page="mvp">Vývoj MVP</button>
      <button class="pv__tab pv__tab--lib" role="tab" data-page="komponenty">Komponenty</button>
    </div>
    <div class="pv__sep"></div>
    <div class="pv__seg" role="group" aria-label="Šířka náhledu">
      <button data-w="fit" aria-pressed="true">Okno</button>
      <button data-w="1440" aria-pressed="false">1440</button>
      <button data-w="390" aria-pressed="false">390</button>
    </div>
    <label class="pv__chk"><input type="checkbox" id="pv-labels"><span>Názvy komponent</span></label>
    <label class="pv__chk"><input type="checkbox" id="pv-rm"><span>Bez animací</span></label>
  </div>
  <div class="pv__order" id="pv-order" aria-live="polite"></div>
</div>
<div class="stage" id="stage"><div class="frame" id="frame"><div class="site" id="site"></div></div></div>

<script>
(() => {
'use strict';
/* ============ Ikony ============ */
const I = {
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  arrowUR:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
  arrows:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 7-5 5 5 5M15 7l5 5-5 5"/></svg>'
};
/* Symbol loga: tři čtvrtkruhy a čtverec (podle skutečného loga Webkit.Studio) */
const SYMBOL = '<svg viewBox="0 0 200 200" aria-hidden="true"><path fill="currentColor" d="M0 0H100V100A100 100 0 0 1 0 0ZM100 0H200V100A100 100 0 0 1 100 0ZM0 100H100V200H0ZM100 100H200V200A100 100 0 0 1 100 100Z"/></svg>';
const logo = (extra='') => `<a class="logo" href="#home" data-go="home" aria-label="Webkit.Studio, domů" ${extra}>${SYMBOL}<span>Webkit.Studio</span></a>`;

/* ============ Pomocníci ============ */
// *text* = modré zvýraznění, [DOPLNIT: …] = žlutý štítek chybějícího faktu
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const t = s => esc(s).replace(/\*([^*]+)\*/g,'<span class="hl">$1</span>').replace(/\[DOPLNIT([^\]]*)\]/g,'<mark class="fill">[DOPLNIT$1]</mark>');
const attrs = o => Object.entries(o).filter(([,v])=>v!=null&&v!==false).map(([k,v])=>v===true?k:`${k}="${esc(v)}"`).join(' ');
const btn = (label, {href='#kontakt', v='primary', size='', extra='', data='', submit=false}={}) => submit ?
  `<button type="submit" class="btn ${extra}"><span class="btn__label"><span data-t="${esc(label)}">${esc(label)}</span></span><span class="btn__disc">${I.arrow}${I.arrow}</span></button>` :
  `<a class="btn ${v!=='primary'?'btn--'+v:''} ${size?'btn--'+size:''} ${extra}" href="${href}" ${data}><span class="btn__label"><span data-t="${esc(label)}">${esc(label)}</span></span><span class="btn__disc">${I.arrow}${I.arrow}</span></a>`;
const sec = (comp, variant, inner, {cls='', id='', sig=false}={}) =>
  `<section class="sec ${cls}" ${attrs({id:id||null,'data-comp':comp,'data-label':comp+(variant?' / '+variant:''),'data-sig':sig||null})}>${inner}</section>`;
// Hlavička sekce: nadpis + perex, žádný štítek
const sh = ({h, lead, side='', solo=false, tag='h2'}) =>
  `<div class="sh ${solo||(!lead&&!side)?'sh--solo':''}" data-reveal><${tag} data-lines>${t(h)}</${tag}>${(lead||side)?`<div class="sh__side">${lead?`<p class="lead">${t(lead)}</p>`:''}${side}</div>`:''}</div>`;

/* Grafický doplněk: dlaždice ze symbolu loga. Typ q = čtvrtkruh, s = čtverec, e = prázdno. */
const TILE = {q:'<path fill="currentColor" d="M0 0H100V100A100 100 0 0 1 0 0Z"/>', s:'<rect fill="currentColor" width="100" height="100"/>', e:''};
const tiles = (n, cells, cls='') => `<div class="tiles ${cls}" style="--n:${n}" data-tiles aria-hidden="true">${cells.map(([k,c,r])=>`<span class="tile tile--${c||'blue'}" style="--r:${r||0}"><svg viewBox="0 0 100 100">${TILE[k]}</svg></span>`).join('')}</div>`;
const ART = {
  home: tiles(3,[['q','blue',0],['q','blue',0],['q','soft',1],['s','blue'],['q','blue',0],['e'],['q','soft',3],['s','ink'],['q','soft',2]]),
  webflow: tiles(2,[['q','blue',0],['q','soft',1],['s','ink'],['q','blue',0]],'tiles--sm'),
  audit: tiles(2,[['q','soft',2],['q','blue',0],['q','blue',3],['s','soft']],'tiles--sm'),
  mvp: tiles(2,[['s','blue'],['q','blue',0],['q','soft',1],['q','ink',2]],'tiles--sm')
};

/* Služby: pořadí podle Lukáše. Levý sloupec weby, pravý ostatní. */
const SERVICES = [
  {h:'Tvorba webových stránek', p:'Nový web, který vede návštěvníky k poptávce.'},
  {h:'Webflow vývoj', go:'webflow', p:'Web, který si upravíte sami, bez programátora.'},
  {h:'Redesign webu', p:'Nový vzhled. Staré adresy přesměrujeme, aby vás lidé dál našli.'},
  {h:'Landing page', p:'Jedna stránka pro kampaň nebo nový produkt.'},
  {h:'UX audit', go:'audit', p:'Zjistíme, kde zákazníci odcházejí a proč.'},
  {h:'Vývoj MVP', go:'mvp', p:'První verze produktu, na které ověříte nápad.'},
  {h:'Vývoj webových aplikací', p:'Nástroje a portály, které nahradí tabulky.'},
  {h:'Vizuální identita', p:'Logo, barvy a pravidla, podle kterých vás lidé poznají.'}
];
const svcHref = s => s.go ? `href="#${s.go}" data-go="${s.go}"` : 'href="#" data-soon';

const IMG = {eldr:'img/web-eldr.jpg', crr:'img/web-crr.jpg', anse:'img/web-anse.jpg', arb:'img/web-arb.jpg'};
const WORK = {
  eldr:{client:'Elektro Drapač', title:'Nový web pro výrobce světelné reklamy', n:'[DOPLNIT: jedno číslo]', nl:'[DOPLNIT: co číslo znamená, např. poptávek za měsíc]', tags:['Tvorba webu','Design']},
  anse:{client:'Anse', title:'Aplikace, která vede zakázku od zaměření po montáž', n:'[DOPLNIT: jedno číslo]', nl:'[DOPLNIT: co číslo znamená]', tags:['Webová aplikace','Design']},
  arb:{client:'Arbosis', title:'Značka zahradní firmy od loga po polep aut', n:'[DOPLNIT: jedno číslo]', nl:'[DOPLNIT: co číslo znamená]', tags:['Vizuální identita']},
  crr:{client:'CRR', title:'Vizuální styl a šablony pro celou instituci', n:'[DOPLNIT: jedno číslo]', nl:'[DOPLNIT: co číslo znamená]', tags:['Vizuální styl','Intranet']}
};

/* ============ Sekční komponenty ============ */
const C = {};
C.nav = page => {
  const cur = k => page===k ? 'aria-current="page"' : '';
  return `<header class="nav" data-comp="Navbar" data-label="Navbar" id="nav">
  <div class="container nav__in">
    ${logo()}
    <nav class="nav__links" aria-label="Hlavní">
      <button class="nav__link" aria-expanded="false" aria-controls="menu" data-menu>Služby ${I.chev}</button>
      <a class="nav__link" href="#prace">Naše práce</a>
      <a class="nav__link" href="#" data-soon>Pro agentury</a>
      <a class="nav__link" href="#" data-soon>O nás</a>
    </nav>
    <div class="nav__cta">${btn('Probrat projekt',{size:'sm'})}</div>
    <button class="nav__burger" aria-expanded="false" aria-controls="menu" aria-label="Otevřít menu" data-burger><span></span></button>
  </div>
  <div class="menu" id="menu">
    <div class="container menu__in">
      <div>${SERVICES.slice(0,4).map(s=>`<a ${svcHref(s)} ${cur(s.go)}>${esc(s.h)}</a>`).join('')}</div>
      <div>${SERVICES.slice(4).map(s=>`<a ${svcHref(s)} ${cur(s.go)}>${esc(s.h)}</a>`).join('')}</div>
      <div class="menu__side">
        <div class="menu__extra"><a href="#prace">Naše práce</a><a href="#" data-soon>Pro agentury</a><a href="#" data-soon>O nás</a></div>
        <p>Nevíte, co vybrat? Napište, co řešíte. Doporučíme postup.</p>
        ${btn('Probrat projekt',{size:'sm'})}
      </div>
    </div>
  </div>
</header>`;
};

C.heroHome = p => sec('Hero','Home, seznam služeb',`<div class="container">
  <div class="hero__grid">
    <div class="hero__text">
      <h1 data-lines>${t(p.h)}</h1>
      <p class="lead" data-reveal>${t(p.lead)}</p>
      <div class="btn-row" data-reveal>${btn(p.cta)}<a class="link link--arrow" href="#prace">${esc(p.cta2)} ${I.arrow}</a></div>
    </div>
    <div class="hero__art" data-reveal>${ART.home}</div>
  </div>
  <nav class="svc-strip" aria-label="Služby" data-reveal>${SERVICES.map(s=>`<a ${svcHref(s)}>${esc(s.h)}</a>`).join('')}</nav>
</div>`,{cls:'hero hero--home'});

C.heroService = p => sec('Hero','Služba',`<div class="container hero__grid">
  <div class="hero__text">
    <h1 data-lines>${t(p.h)}</h1>
    <p class="lead" data-reveal>${t(p.lead)}</p>
    <ul class="hero__proof" data-reveal>${p.proof.map(x=>`<li>${I.check}<span>${t(x)}</span></li>`).join('')}</ul>
    <div class="btn-row" data-reveal>${btn(p.cta)}</div>
  </div>
  <div class="hero__art" data-reveal>${p.art}</div>
</div>`,{cls:'hero'});

C.statement = p => sec('Statement','Hodnoty a CTA',`<div class="container">
  <p class="statement" data-lines>${p.html}</p>
  <div class="values">${p.values.map(v=>`<div class="value" data-reveal><h3>${t(v.h)}</h3><p>${t(v.p)}</p></div>`).join('')}</div>
  <div class="statement-foot" data-reveal>${btn(p.cta)}</div>
</div>`,{cls:'sec--surface'});

C.services = p => sec('Seznam služeb','2 sloupce po 4',`<div class="container">
  ${sh({h:p.h, lead:p.lead})}
  <div class="svc2">${[SERVICES.slice(0,4),SERVICES.slice(4)].map(col=>`<div class="svc2__col">${col.map(s=>`<a class="srow" ${svcHref(s)} data-reveal><h3>${esc(s.h)}</h3><p>${esc(s.p)}</p><span class="srow__arrow">${I.arrowUR}</span></a>`).join('')}</div>`).join('')}</div>
  <p class="svc-agency" data-reveal>Jste agentura? <a class="link link--static" href="#" data-soon>Podívejte se, jak spolupracujeme s agenturami</a></p>
</div>`,{id:'sluzby'});

C.work = p => sec('Naše práce','Velká grafika (portfolio-17)',`<div class="container">
  ${sh({h:p.h, lead:p.lead})}
  <div class="works">${p.ids.map(id=>{const x=WORK[id];return `<a class="work" href="#prace" data-reveal>
    <div class="work__media"><img src="${IMG[id]}" alt="" width="1600" height="900"></div>
    <div class="work__body">
      <div style="display:grid;gap:14px"><span class="work__client">${esc(x.client)}</span><h3 class="work__title">${t(x.title)}</h3></div>
      <div class="work__foot"><div class="work__n">${t(x.n)}<small>${t(x.nl)}</small></div></div>
      <div class="tags">${x.tags.map(g=>`<span class="tag">${t(g)}</span>`).join('')}</div>
    </div>
    <span class="work__go" aria-hidden="true">${I.arrowUR}</span>
    <span class="sr-only">Zobrazit projekt ${esc(x.client)}</span>
  </a>`}).join('')}</div>
  ${p.all!==false?`<div class="works-foot" data-reveal><a class="link link--arrow" href="#prace">Všechny projekty ${I.arrow}</a></div>`:''}
</div>`,{id:'prace'});

C.reasons = p => sec('Proč s námi','6 důvodů',`<div class="container">
  ${sh({h:p.h})}
  <div class="reasons">${p.items.map((x,i)=>`<div class="reason" data-reveal><span class="reason__n">${String(i+1).padStart(2,'0')}</span><h3>${t(x.h)}</h3><p>${t(x.p)}</p></div>`).join('')}</div>
</div>`,{id:'proc-my'});

C.refs = p => sec('Reference','Citace a Webflow Partner',`<div class="container">
  ${sh({h:p.h})}
  <div class="refs">
    <div data-reveal><blockquote>${t(p.quote)}</blockquote><p class="refs__who"><strong>${t(p.who)}</strong></p></div>
    ${p.partner===false?'':`<div class="partner" data-reveal><span class="partner__mark" aria-hidden="true">W</span><h3>Webflow Partner</h3><p>${t('Webflow nás vede v seznamu ověřených partnerů.')}</p><a class="link link--arrow" href="#" data-soon>${t('Profil partnera [DOPLNIT: odkaz na profil]')} ${I.arrowUR}</a></div>`}
  </div>
</div>`,{cls:'sec--surface',id:'reference'});

C.process = p => sec('Postup', p.steps.length+' kroků',`<div class="container">
  ${sh({h:p.h, lead:p.lead})}
  <ol class="steps" style="--cols:${p.cols||3}">${p.steps.map((x,i)=>`<li class="step" data-reveal><div class="step__top"><span class="step__n">${String(i+1).padStart(2,'0')}</span>${x.free?`<span class="step__free">${t(x.free)}</span>`:''}</div><h3>${t(x.h)}</h3><p>${t(x.p)}</p></li>`).join('')}</ol>
  <div class="steps-foot" data-reveal>${btn(p.cta)}</div>
</div>`,{id:'postup'});

C.problems = p => sec('Časté problémy','3 otázky',`<div class="container">
  ${sh({h:p.h, lead:p.lead})}
  <div class="probs">${p.items.map(x=>`<div class="prob" data-reveal><h3>${t(x.q)}</h3><p>${t(x.a)}</p>${x.fix?`<p class="prob__fix">${t(x.fix)}</p>`:''}</div>`).join('')}</div>
  ${p.cta?`<div class="probs-foot" data-reveal>${btn(p.cta)}</div>`:''}
</div>`,{id:'problemy'});

C.gets = p => sec('Seznam služeb','Co dostanete',`<div class="container">
  ${sh({h:p.h, lead:p.lead})}
  <div class="gets">${p.items.map((x,i)=>`<div class="get" data-reveal><span class="get__n">${i+1}</span><h3>${t(x.h)}</h3><p>${t(x.p)}</p>${p.need?`<button type="button" class="get__need" data-need="${esc(x.h)}">Tohle potřebuju ${I.arrow}</button>`:''}</div>`).join('')}</div>
</div>`,{id:'co-dostanete'});

C.faq = p => sec('FAQ','',`<div class="container faq-wrap">
  ${sh({h:p.h, lead:p.lead})}
  <div class="faq">${p.items.map((x,i)=>`<details name="faq" ${i===0?'open':''} data-reveal><summary>${t(x.q)}<span class="plus" aria-hidden="true"></span></summary><div class="faq__a"><p>${t(x.a)}</p></div></details>`).join('')}</div>
</div>`,{id:'faq'});

C.form = (p={}) => `<form class="form" name="Poptávka z homepage" data-name="Poptávka z homepage" novalidate data-form>
  <div class="form__fields">
    <div class="field"><label for="co-resite">Co řešíte?</label><div class="ta" data-ta><div class="ta__ghost" aria-hidden="true"><span class="ta__pre">Například: </span><span class="ta__txt"></span></div><textarea class="input" id="co-resite" name="co-resite" aria-describedby="co-resite-msg" required></textarea></div><span class="field__msg" id="co-resite-msg"></span></div>
    <div class="form__row">
      <div class="field"><label for="name">Jméno</label><input class="input" id="name" name="name" autocomplete="name" aria-describedby="name-msg" required><span class="field__msg" id="name-msg"></span></div>
      <div class="field"><label for="firma">Firma</label><input class="input" id="firma" name="firma" autocomplete="organization" aria-describedby="firma-msg" required><span class="field__msg" id="firma-msg"></span></div>
    </div>
    <div class="field"><label for="email">E-mail</label><input class="input" id="email" name="email" type="email" autocomplete="email" aria-describedby="email-msg" required><span class="field__msg" id="email-msg"></span></div>
    <div class="form__send">${btn('Odeslat poptávku',{submit:true,extra:'js-submit'})}<span class="form__promise">Ozveme se do 24 hodin.</span></div>
  </div>
  <div class="form__ok" role="status">
    <h3 tabindex="-1">Díky, máme to. Vyberte si termín hovoru.</h3>
    <p class="muted">Termín je na vás. Když si nevyberete, ozveme se sami.</p>
    <div class="cal" data-cal></div>
    <p class="form__note">${t('Ukázka stavu po odeslání. V ostrém provozu tu bude [DOPLNIT: rezervační nástroj].')}</p>
  </div>
</form>`;

C.cta = p => sec('CTA s formulářem','',`<div class="container cta-big__grid">
  <div class="cta-big__left">
    <h2 data-lines>${t(p.h)}</h2>
    <p class="lead">${t(p.lead)}</p>
    <p class="who__t">Radši e-mail? <a class="link link--static" href="mailto:inbox@webkit.studio" style="color:#fff">inbox@webkit.studio</a></p>
    <div class="who"><img src="img/lukas.webp" alt="" width="56" height="56"><p class="who__t">Lukáš Svoboda, Studio Lead<br><a class="link link--static" href="#" data-soon style="color:#fff">${t('LinkedIn [DOPLNIT: URL]')}</a></p></div>
  </div>
  ${C.form()}
</div>`,{cls:'cta-big',id:'kontakt'});

C.footer = () => `<footer class="foot" data-comp="Footer" data-label="Footer / velké logo">
  <div class="container">

const stage = document.getElementById('stage');

function render(page){
  cleanup.forEach(f=>f()); cleanup=[];
  current = page;
  document.querySelectorAll('.pv__tab').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.page===page)));
  site.innerHTML = page==='komponenty' ? C.nav('') + lib() + C.footer() : C.nav(page) + '<main>' + PAGES[page].sections().join('') + '</main>' + C.footer();
  if(page==='komponenty'){ orderEl.innerHTML = '<b>Knihovna</b><span>Tokeny, primitiva, grafický doplněk, sekční komponenty s props, vyřazené komponenty.</span>'; }
  else {
    const items = [...site.querySelectorAll('main > [data-comp]')].map(s=>`<li class="${s.dataset.sig?'sig':''}">${esc(s.dataset.comp.replace('Podpis: ','★ '))}</li>`).join('');
    orderEl.innerHTML = `<b>${esc(PAGES[page].title)}</b><ol>${items}</ol>`;
  }
  document.title = (page==='komponenty'?'Komponenty':PAGES[page].title) + ' | Webkit.Studio v2 náhled';
  window.scrollTo(0,0);
  setTbH(); initNav(); initNeed(); initForms(); initBA(); initTiles(); initMotion(site);
}

function setTbH(){ const h = document.getElementById('pv').getBoundingClientRect().height; document.documentElement.style.setProperty('--tb-h', (h/zoom)+'px'); }

function initNav(){
  const nav = site.querySelector('#nav'); if(!nav) return;
  const menu = nav.querySelector('.menu');
  const triggers = nav.querySelectorAll('[data-menu],[data-burger]');
  const burger = nav.querySelector('[data-burger]');
  const setOpen = open => {
    menu.classList.toggle('is-open', open); nav.classList.toggle('is-open', open);
    triggers.forEach(tr=>tr.setAttribute('aria-expanded', String(open)));
    burger.setAttribute('aria-label', open?'Zavřít menu':'Otevřít menu');
  };
  let opener = null;
  triggers.forEach(tr=>tr.addEventListener('click',()=>{ opener = tr; setOpen(!menu.classList.contains('is-open')); }));
  const onKey = e => { if(e.key==='Escape' && menu.classList.contains('is-open')){ setOpen(false); (opener && opener.offsetParent ? opener : burger).focus(); } };
  document.addEventListener('keydown', onKey); cleanup.push(()=>document.removeEventListener('keydown', onKey));
  menu.addEventListener('click', e=>{ if(e.target.closest('a')) setOpen(false); });
  let lastY = window.scrollY, acc = 0;
  const onScroll = () => {
    const y = window.scrollY, dy = y - lastY; lastY = y;
    nav.classList.toggle('is-scrolled', y > 8);
    if(menu.classList.contains('is-open')) return;
    if(y < 120){ nav.classList.remove('is-hidden'); acc=0; return; }
    acc = (Math.sign(dy)===Math.sign(acc)) ? acc+dy : dy;
    if(acc > 40) nav.classList.add('is-hidden'); else if(acc < -30) nav.classList.remove('is-hidden');
  };
  window.addEventListener('scroll', onScroll, {passive:true}); cleanup.push(()=>window.removeEventListener('scroll', onScroll));
}

function scrollToEl(el){
  const y = el.getBoundingClientRect().top + window.scrollY - (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tb-h'))||0)*zoom + 2;
  window.scrollTo({top:y, behavior: reduced?'auto':'smooth'});
}

function initNeed(){
  site.querySelectorAll('[data-need]').forEach(b=>b.addEventListener('click',e=>{
    e.preventDefault();
    const ta = site.querySelector('#co-resite'); const k = site.querySelector('#kontakt');
    if(ta){ ta.value = `Zajímá mě: ${b.dataset.need}. `; ta.dispatchEvent(new Event('input')); }
    if(k){ scrollToEl(k); setTimeout(()=>{ if(ta){ ta.focus({preventScroll:true}); ta.setSelectionRange(ta.value.length, ta.value.length); } }, reduced?0:700); }
  }));
}

function initTypewriter(wrap){
  const ta = wrap.querySelector('textarea'); const ghost = wrap.querySelector('.ta__txt');
  const sync = () => wrap.classList.toggle('is-typing', ta.value.length>0 || document.activeElement===ta);
  ['input','focus','blur'].forEach(ev=>ta.addEventListener(ev, sync)); sync();
  ta.setAttribute('placeholder', ''); ta.setAttribute('aria-description', 'Například: ' + EXAMPLES[0]);
  if(reduced){ ghost.textContent = EXAMPLES[0]; return; }
  let i=0, n=0, del=false, alive=true, tm;
  const step = () => { if(!alive) return; const s = EXAMPLES[i];
    if(!del){ n++; ghost.textContent = s.slice(0,n); if(n===s.length){ del=true; tm=setTimeout(step,2400); return; } tm=setTimeout(step,32); }
    else { n-=3; if(n<=0){ n=0; del=false; i=(i+1)%EXAMPLES.length; ghost.textContent=''; tm=setTimeout(step,400); return; } ghost.textContent = s.slice(0,n); tm=setTimeout(step,12); } };
  step(); cleanup.push(()=>{ alive=false; clearTimeout(tm); });
}

function calendar(box){
  const d0 = new Date(); const days=[]; const d = new Date(d0);
  while(days.length<5){ d.setDate(d.getDate()+1); if(d.getDay()!==0 && d.getDay()!==6) days.push(new Date(d)); }
  const dn = ['Ne','Po','Út','St','Čt','Pá','So'];
  box.innerHTML = `<div class="cal__head"><span>Úvodní hovor online</span></div>
    <div class="cal__days" role="group" aria-label="Den">${days.map((x,i)=>`<button type="button" class="cal__day" aria-pressed="${i===0}">${dn[x.getDay()]}<b>${x.getDate()}. ${x.getMonth()+1}.</b></button>`).join('')}</div>
    <div class="cal__slots" role="group" aria-label="Čas">${['9:00','10:30','13:00','15:30'].map(s=>`<button type="button" class="cal__slot">${s}</button>`).join('')}</div>`;
  box.querySelectorAll('.cal__day').forEach(b=>b.addEventListener('click',()=>box.querySelectorAll('.cal__day').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))));
  box.querySelectorAll('.cal__slot').forEach(b=>b.addEventListener('click',()=>{ const day = box.querySelector('.cal__day[aria-pressed="true"] b').textContent; box.innerHTML = `<p style="font-weight:600">Hotovo. Hovor máte ${day} v ${b.textContent}.</p><p class="muted">Pozvánku najdete v e-mailu.</p>`; }));
}

function initForms(){
  site.querySelectorAll('[data-form]').forEach(f=>{
    const wrap = f.querySelector('[data-ta]'); if(wrap) initTypewriter(wrap);
    const submit = f.querySelector('.js-submit');
    f.addEventListener('submit', e=>{
      e.preventDefault();
      let ok = true;
      f.querySelectorAll('[required]').forEach(inp=>{
        const field = inp.closest('.field'); const bad = !inp.value.trim() || (inp.type==='email' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(inp.value));
        field.classList.toggle('is-error', bad); inp.setAttribute('aria-invalid', String(bad));
        const msg = field.querySelector('.field__msg');
        msg.textContent = !bad ? '' : inp.type==='email' ? 'Doplňte celý e-mail, např. jan@firma.cz' : inp.id==='firma' ? 'Napište název firmy.' : 'Tohle pole potřebujeme vyplnit.';
        if(bad && ok){ ok=false; inp.focus(); }
      });
      if(!ok) return;
      submit.classList.add('is-loading');
      setTimeout(()=>{ submit.classList.remove('is-loading'); f.classList.add('is-sent'); calendar(f.querySelector('[data-cal]')); f.querySelector('.form__ok h3').focus(); }, 700);
    });
  });
}

function initTiles(){
  site.querySelectorAll('[data-tiles]').forEach(g=>{
    const ts = [...g.querySelectorAll('.tile')];
    const turn = tl => tl.style.setProperty('--r', (parseInt(tl.style.getPropertyValue('--r'))||0) + 1);
    if(reduced) return;
    ts.forEach(tl=>tl.addEventListener('pointerenter', ()=>turn(tl)));
    const id = setInterval(()=>{ if(document.hidden) return; turn(ts[Math.floor(Math.random()*ts.length)]); }, 2600);
    cleanup.push(()=>clearInterval(id));
  });
}

(function initAnchors(){
  site.addEventListener('click', e=>{
    const a = e.target.closest('a'); if(!a) return;
    const go = a.dataset.go; const href = a.getAttribute('href')||'';
    if(go){ e.preventDefault(); location.hash = go; return; }
    if(a.hasAttribute('data-soon') || href==='#'){ e.preventDefault(); return; }
    if(href.startsWith('#')){ e.preventDefault(); const el = site.querySelector(href); if(el) scrollToEl(el); }
  });
})();

/* Pohyb: řádky nadpisů + scroll reveal */
let io;
function splitWords(el){
  if(el.dataset.split) return;
  const walk = node => {
    [...node.childNodes].forEach(n=>{
      if(n.nodeType===3){
        const frag = document.createDocumentFragment();
        n.textContent.split(/(\s+)/).forEach(p=>{ if(!p) return; if(/^\s+$/.test(p)) frag.appendChild(document.createTextNode(p)); else { const s=document.createElement('span'); s.className='w'; s.textContent=p; frag.appendChild(s);} });
        n.replaceWith(frag);
      } else if(n.nodeType===1 && !n.classList.contains('fill')) walk(n);
      else if(n.nodeType===1) n.classList.add('w');
    });
  };
  walk(el); el.dataset.split='1';
}
function playLines(el){
  if(reduced) return;
  splitWords(el);
  const ws = [...el.querySelectorAll('.w')]; if(!ws.length) return;
  ws.forEach(w=>{w.style.transition='none'}); el.classList.add('lines-pre'); void el.offsetWidth;
  let top = null, line = -1;
  ws.forEach(w=>{ const tp = w.offsetTop; if(top===null || Math.abs(tp-top)>4){ line++; top=tp; } w.style.transition=''; w.style.transitionDelay=(line*80)+'ms'; });
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.remove('lines-pre')));
}
function initMotion(root){
  if(io) io.disconnect();
  document.documentElement.classList.toggle('js-motion', !reduced);
  if(reduced) return;
  const vh = window.innerHeight;
  io = new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(!en.isIntersecting) return;
      const el = en.target; io.unobserve(el);
      if(el.hasAttribute('data-lines')){ document.fonts.ready.then(()=>playLines(el)); return; }
      const sibs = el.parentElement ? [...el.parentElement.children].filter(c=>c.hasAttribute('data-reveal')) : [el];
      setTimeout(()=>el.classList.remove('is-pre'), Math.min(Math.max(0,sibs.indexOf(el)),6)*70);
    });
  },{threshold:0.1, rootMargin:'0px 0px -5% 0px'});
  root.querySelectorAll('[data-reveal]').forEach(el=>{
    const r = el.getBoundingClientRect();
    if(r.top < vh*0.92 && r.bottom > 0) return; // nad ohybem: hned vidět
    el.classList.add('is-pre'); io.observe(el);
  });
  root.querySelectorAll('[data-lines]').forEach(el=>{
    const r = el.getBoundingClientRect();
    if(r.top < vh && r.bottom > 0){ el.classList.add('lines-soft'); document.fonts.ready.then(()=>playLines(el)); }
    else io.observe(el);
  });
}

function applyWidth(w){
  stage.className = 'stage' + (w==='fit' ? ' stage--fit' : ' stage--w'+w);
  document.querySelectorAll('.pv__seg button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.w===w)));
  zoom = 1;
  if(w==='1440'){ const avail = document.documentElement.clientWidth - 32; zoom = Math.min(1, avail/1440); }
  frame.style.setProperty('--zoom', zoom);
  setTbH();
  try{ localStorage.setItem('wk-pv-w', w); }catch(e){}
}
document.querySelectorAll('.pv__seg button').forEach(b=>b.addEventListener('click',()=>{ applyWidth(b.dataset.w); render(current); }));
