/* ============ Render + chování ============ */
const site = document.getElementById('site');
const stage = document.getElementById('stage');
const frame = document.getElementById('frame');
const orderEl = document.getElementById('pv-order');
const rmQuery = matchMedia('(prefers-reduced-motion: reduce)');
let reduced = rmQuery.matches;
let current = 'home';
let zoom = 1;
let cleanup = [];

function render(page){
  cleanup.forEach(f=>f()); cleanup=[];
  current = page;
  document.querySelectorAll('.pv__tab').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.page===page)));
  let html;
  if(page==='komponenty'){ html = C.nav('') + lib() + C.footer(); }
  else { html = C.nav(page) + '<main>' + PAGES[page].sections().join('') + '</main>' + C.footer(); }
  site.innerHTML = html;
  // pořadí sekcí do lišty
  if(page==='komponenty'){ orderEl.innerHTML = '<b>Knihovna</b><span>Tokeny, primitiva, sekce s variantami a props, interakce, rozpočet. Varianty přepínáte vpravo u každé komponenty.</span>'; }
  else {
    const items = [...site.querySelectorAll('main > [data-comp]')].map(s=>`<li class="${s.dataset.sig?'sig':''}">${esc(s.dataset.comp.replace('Podpis: ','★ '))}</li>`).join('');
    orderEl.innerHTML = `<b>${esc(PAGES[page].title)}</b><ol>${items}</ol>`;
  }
  document.title = (page==='komponenty'?'Komponenty':PAGES[page].title) + ' | Webkit.Studio v2 náhled';
  initSite();
  window.scrollTo(0,0);
}

function initSite(){
  setTbH();
  initNav(); initSvc(); initNeed(); initForms(); initBA(); initPeek(); initVars(); initAnchors();
  initMotion(site);
}

function setTbH(){ const h = document.getElementById('pv').getBoundingClientRect().height; document.documentElement.style.setProperty('--tb-h', (h/zoom)+'px'); }

function initNav(){
  const nav = site.querySelector('#nav'); if(!nav) return;
  const mega = nav.querySelector('.mega');
  const triggers = nav.querySelectorAll('[data-mega],[data-burger]');
  const setOpen = (open, src) => {
    mega.classList.toggle('is-open', open); nav.classList.toggle('is-open', open);
    triggers.forEach(tr=>tr.setAttribute('aria-expanded', String(open && (!src || tr===src || tr.hasAttribute('data-burger')===src.hasAttribute('data-burger')))));
    const burger = nav.querySelector('[data-burger]'); burger.setAttribute('aria-label', open?'Zavřít menu':'Otevřít menu');
  };
  triggers.forEach(tr=>tr.addEventListener('click',()=>setOpen(!mega.classList.contains('is-open'), tr)));
  const hoverBtn = nav.querySelector('[data-mega]'); let ht;
  const canHover = matchMedia('(hover:hover) and (pointer:fine)').matches;
  if(canHover){
    hoverBtn.addEventListener('mouseenter',()=>{clearTimeout(ht);setOpen(true,hoverBtn)});
    nav.addEventListener('mouseleave',()=>{ht=setTimeout(()=>setOpen(false),180)});
    mega.addEventListener('mouseenter',()=>clearTimeout(ht));
  }
  const onKey = e => { if(e.key==='Escape' && mega.classList.contains('is-open')){ setOpen(false); hoverBtn.focus(); } };
  document.addEventListener('keydown', onKey); cleanup.push(()=>document.removeEventListener('keydown', onKey));
  mega.addEventListener('click', e=>{ if(e.target.closest('a')) setOpen(false); });
  // skrývání při scrollu
  let lastY = window.scrollY, acc = 0;
  const onScroll = () => {
    const y = window.scrollY, dy = y - lastY; lastY = y;
    nav.classList.toggle('is-scrolled', y > 8);
    if(mega.classList.contains('is-open')) return;
    if(y < 120){ nav.classList.remove('is-hidden'); acc=0; return; }
    acc = (Math.sign(dy)===Math.sign(acc)) ? acc+dy : dy;
    if(acc > 40) nav.classList.add('is-hidden');
    else if(acc < -30) nav.classList.remove('is-hidden');
  };
  window.addEventListener('scroll', onScroll, {passive:true}); cleanup.push(()=>window.removeEventListener('scroll', onScroll));
}

function initSvc(){
  site.querySelectorAll('.svc__head').forEach(h=>h.addEventListener('click',()=>{
    const item = h.closest('.svc__item'); const open = !item.classList.contains('is-open');
    item.classList.toggle('is-open', open); h.setAttribute('aria-expanded', String(open));
  }));
}

function scrollToEl(el){
  const y = el.getBoundingClientRect().top + window.scrollY - (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tb-h'))||0)*zoom + 2;
  window.scrollTo({top:y, behavior: reduced?'auto':'smooth'});
}

function initNeed(){
  site.querySelectorAll('[data-need]').forEach(b=>b.addEventListener('click',e=>{
    e.preventDefault();
    const ta = site.querySelector('#co-resite'); const k = site.querySelector('#kontakt');
    if(ta){ ta.value = `Zajímá mě: ${b.dataset.need}. `; }
    if(k){ scrollToEl(k); setTimeout(()=>{ ta && ta.focus({preventScroll:true}); if(ta) ta.setSelectionRange(ta.value.length, ta.value.length); }, reduced?0:700); }
  }));
}

function initForms(){
  site.querySelectorAll('[data-form]').forEach(f=>{
    const submit = f.querySelector('.js-submit');
    const go = e => {
      e.preventDefault();
      let ok = true;
      f.querySelectorAll('[required]').forEach(inp=>{
        const field = inp.closest('.field'); const bad = !inp.value.trim() || (inp.type==='email' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(inp.value));
        field.classList.toggle('is-error', bad); inp.setAttribute('aria-invalid', String(bad));
        let msg = field.querySelector('.field__msg');
        if(bad){ if(!msg){ msg=document.createElement('span'); msg.className='field__msg'; field.appendChild(msg);} msg.dataset.orig = msg.dataset.orig ?? msg.textContent; msg.textContent = inp.type==='email' ? 'Doplňte celý e-mail, např. jan@firma.cz' : 'Tohle pole potřebujeme vyplnit.'; }
        else if(msg && msg.dataset.orig!=null){ msg.textContent = msg.dataset.orig; }
        if(bad && ok){ ok=false; inp.focus(); }
      });
      if(!ok) return;
      submit.classList.add('is-loading');
      setTimeout(()=>{ submit.classList.remove('is-loading'); f.classList.add('is-sent'); f.querySelector('.form__ok h3').setAttribute('tabindex','-1'); f.querySelector('.form__ok h3').focus(); }, 700);
    };
    submit.addEventListener('click', go); f.addEventListener('submit', go);
  });
}

function initBA(){
  site.querySelectorAll('[data-ba]').forEach(ba=>{
    const r = ba.querySelector('.ba__range');
    const set = v => ba.style.setProperty('--pos', v+'%');
    r.addEventListener('input',()=>set(r.value));
    set(r.value);
  });
}

function initPeek(){
  const fine = matchMedia('(hover:hover) and (pointer:fine)').matches;
  site.querySelectorAll('[data-peek]').forEach(list=>{
    const peek = list.querySelector('.peek'); const img = peek.querySelector('img');
    if(!fine) return;
    let tx=0, ty=0, x=0, y=0, raf=0, on=false;
    const loop = () => { x += (tx-x)*.18; y += (ty-y)*.18; peek.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%)`; if(on || Math.abs(tx-x)>.5) raf=requestAnimationFrame(loop); else raf=0; };
    list.addEventListener('mousemove', e=>{
      const r = list.getBoundingClientRect(); tx = (e.clientX - r.left)/zoom; ty = (e.clientY - r.top)/zoom;
      if(reduced){ x=tx; y=ty; peek.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%)`; return; }
      if(!raf) raf=requestAnimationFrame(loop);
    });
    list.querySelectorAll('.prow').forEach(row=>row.addEventListener('mouseenter',()=>{
      if(img.getAttribute('src')!==row.dataset.img) img.src=row.dataset.img;
      if(!on){ const r=list.getBoundingClientRect(); x=tx; y=ty; }
      on=true; peek.classList.add('is-on');
    }));
    list.addEventListener('mouseleave',()=>{ on=false; peek.classList.remove('is-on'); });
  });
}

function initVars(){
  site.querySelectorAll('[data-compbox]').forEach(box=>{
    const btns = box.querySelectorAll('.comp__vars button'); const panes = box.querySelectorAll('[data-varpane]');
    btns.forEach(b=>b.addEventListener('click',()=>{
      btns.forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
      panes.forEach(p=>p.hidden = p.dataset.varpane!==b.dataset.var);
      const shown = box.querySelector(`[data-varpane="${b.dataset.var}"]`);
      initBAIn(shown); initMotion(shown, true);
    }));
  });
  const rl = site.querySelector('[data-replay-lines]'); if(rl) rl.addEventListener('click',()=>{ const h=site.querySelector('[data-lines-demo]'); if(h){ delete h.dataset.linesDone; playLines(h); } });
  const rr = site.querySelector('[data-replay-reveal]'); if(rr) rr.addEventListener('click',()=>{ const s=site.querySelector('[data-ix-reveal]'); if(!s||reduced) return; const els=[...s.querySelectorAll('[data-reveal]')]; els.forEach(el=>{el.style.transition='none';el.classList.add('is-pre')}); void s.offsetWidth; els.forEach((el,i)=>{el.style.transition='';setTimeout(()=>el.classList.remove('is-pre'), 80+i*90)}); });
}
function initBAIn(root){ root && root.querySelectorAll('[data-ba]').forEach(ba=>{ const r=ba.querySelector('.ba__range'); ba.style.setProperty('--pos', r.value+'%'); r.oninput=()=>ba.style.setProperty('--pos', r.value+'%'); }); }

function initAnchors(){
  site.addEventListener('click', e=>{
    const a = e.target.closest('a'); if(!a) return;
    const go = a.dataset.go; const href = a.getAttribute('href')||'';
    if(go){ e.preventDefault(); location.hash = go; return; }
    if(a.hasAttribute('data-soon') || href==='#'){ e.preventDefault(); return; }
    if(href.startsWith('#') && !a.hasAttribute('data-need') && !a.hasAttribute('data-jump')){
      e.preventDefault(); const el = site.querySelector(href); if(el) scrollToEl(el);
    }
    if(a.hasAttribute('data-jump')){ e.preventDefault(); const el = site.querySelector('#'+a.dataset.jump); if(el) scrollToEl(el); }
  });
}

/* Pohyb: řádky nadpisů + scroll reveal */
let io;
function splitWords(el){
  if(el.dataset.split) return;
  const walk = node => {
    [...node.childNodes].forEach(n=>{
      if(n.nodeType===3){
        const parts = n.textContent.split(/(\s+)/); const frag = document.createDocumentFragment();
        parts.forEach(p=>{ if(!p) return; if(/^\s+$/.test(p)) frag.appendChild(document.createTextNode(p)); else { const s=document.createElement('span'); s.className='w'; s.textContent=p; frag.appendChild(s);} });
        n.replaceWith(frag);
      } else if(n.nodeType===1 && !n.classList.contains('fill')) walk(n);
      else if(n.nodeType===1){ n.classList.add('w'); }
    });
  };
  walk(el); el.dataset.split='1';
}
function playLines(el){
  if(reduced) return;
  splitWords(el);
  const ws = [...el.querySelectorAll('.w')]; if(!ws.length) return;
  el.classList.remove('lines-pre'); ws.forEach(w=>{w.style.transition='none'}); el.classList.add('lines-pre'); void el.offsetWidth;
  let top = null, line = -1;
  ws.forEach(w=>{ const tp = w.offsetTop; if(top===null || Math.abs(tp-top)>4){ line++; top=tp; } w.style.transitionDelay = (line*80)+'ms'; w.style.transition=''; w.style.transitionDelay=(line*80)+'ms'; });
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.remove('lines-pre')));
  el.dataset.linesDone='1';
}
function initMotion(root, force){
  if(io && !force){ io.disconnect(); }
  document.documentElement.classList.toggle('js-motion', !reduced);
  if(reduced){ root.querySelectorAll('[data-bar]').forEach(b=>b.style.setProperty('--p','100%')); return; }
  const vh = window.innerHeight;
  io = io && force ? io : new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(!en.isIntersecting) return;
      const el = en.target; io.unobserve(el);
      if(el.hasAttribute('data-lines')){ document.fonts.ready.then(()=>playLines(el)); return; }
      const sibs = el.parentElement ? [...el.parentElement.children].filter(c=>c.hasAttribute('data-reveal')) : [el];
      const i = Math.max(0, sibs.indexOf(el));
      setTimeout(()=>el.classList.remove('is-pre'), Math.min(i,6)*70);
      const bar = el.querySelector && el.querySelector('[data-bar]'); if(bar) setTimeout(()=>bar.style.setProperty('--p','100%'), 300);
    });
  },{threshold:0.1, rootMargin:'0px 0px -5% 0px'});
  root.querySelectorAll('[data-reveal]').forEach(el=>{
    if(el.closest('[hidden]')) return;
    const r = el.getBoundingClientRect();
    if(r.top < vh*0.92 && r.bottom > 0){ const bar = el.querySelector('[data-bar]'); if(bar) setTimeout(()=>bar.style.setProperty('--p','100%'), 400); return; } // nad ohybem: hned vidět
    el.classList.add('is-pre'); io.observe(el);
  });
  root.querySelectorAll('[data-lines]').forEach(el=>{
    if(el.closest('[hidden]')) return;
    const r = el.getBoundingClientRect();
    if(r.top < vh && r.bottom > 0){ document.fonts.ready.then(()=>playLines(el)); }
    else io.observe(el);
  });
}

function applyWidth(w){
  stage.className = 'stage' + (w==='fit' ? ' stage--fit' : ' stage--w'+w);
  document.querySelectorAll('.pv__seg button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.w===w)));
  zoom = 1;
  if(w==='1440'){ const avail = document.documentElement.clientWidth - 32; zoom = Math.min(1, avail/1440); }
  frame.style.setProperty('--zoom', zoom);
  setTbH();
  try{ localStorage.setItem('wk-pv-w', w); }catch(e){}
}

rmQuery.addEventListener && rmQuery.addEventListener('change', ()=>{ reduced = rmQuery.matches || document.getElementById('pv-rm').checked; render(current); });
window.addEventListener('resize', ()=>{ const w = document.querySelector('.pv__seg button[aria-pressed="true"]').dataset.w; if(w==='1440') applyWidth('1440'); else setTbH(); });
const pages = ['home','webflow','audit','mvp','komponenty'];
const fromHash = () => { const h = location.hash.replace('#',''); return pages.includes(h) ? h : null; };
window.addEventListener('hashchange', ()=>{ const p = fromHash(); if(p && p!==current) render(p); });
let w0 = 'fit'; try{ w0 = localStorage.getItem('wk-pv-w') || 'fit'; }catch(e){}
applyWidth(w0);
render(fromHash() || 'home');
})();
